<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Aura</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
:root{--acc:#22D3EE;--acc2:#3B82F6;--on:#fff;--bg:#0B0F16;--tile:#151B25;--ink:#EEF2F8;--mut:#8F99A9;--mono:JB,ui-monospace,monospace;--sat:28px;--sab:16px;--isz:58px;--eo:cubic-bezier(.2,.9,.25,1);--sp:cubic-bezier(.3,1.45,.5,1);--tx:0px;--ty:0px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;font-family:Barlow,Roboto,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
.ic{width:22px;height:22px;flex:none}
img{-webkit-user-drag:none;user-drag:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes aUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes wig{0%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}100%{transform:rotate(-1.6deg)}}

/* ===== fondo + inclinación ===== */
#wall{position:fixed;inset:-24px;z-index:0;background:#111 center/cover no-repeat;transform:translate3d(calc(var(--tx) * -1.6),calc(var(--ty) * -1.6),0) scale(1.04);transition:filter .45s,transform .12s linear;will-change:transform}
body.drawerOpen #wall{filter:blur(22px) brightness(.55) saturate(1.3)}
body.folderOpen #wall,body.editing #wall{filter:blur(8px) brightness(.7)}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 22%,transparent 62%,rgba(0,0,0,.42))}

/* ===== inicio ===== */
#home{position:fixed;inset:0;z-index:2;padding-top:calc(var(--sat) + 14px);display:flex;flex-direction:column;transition:opacity .35s,transform .45s var(--eo)}
body.drawerOpen #home{opacity:0;transform:scale(.92)}
body.editing #home{padding-top:calc(var(--sat) + 62px)}
body.folderOpen #home{opacity:.25;transform:scale(.97)}
#pager{position:relative;flex:1;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;padding:0 20px;transform-origin:50% 50%;will-change:transform}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.wbig{grid-column:1/3}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:16px 6px}
.ai{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative;touch-action:none}
.ai .ic2{position:relative;width:var(--isz);height:var(--isz);border-radius:28%;transition:transform .25s var(--sp)}
.ai .ic2 img{position:relative;width:100%;height:100%;border-radius:26%;object-fit:cover;z-index:1;display:block}
.ai .ic2 .gl{position:absolute;inset:8%;border-radius:30%;background:var(--g,#888);filter:blur(13px);opacity:0;transform:translateY(6px) scale(1.05);transition:opacity .4s}
body.glow .ai .ic2 .gl{opacity:.85}
body.glow .ai .ic2::after{content:"";position:absolute;inset:0;border-radius:26%;z-index:2;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.12)}
.ai small{font-size:11.5px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.65);transition:opacity .3s}
body.nolabels .ai small{opacity:0}
.ai:active .ic2,.ai.prs .ic2{transform:scale(.86)}
.ai.lch .ic2{animation:lch .5s ease-out}
@keyframes lch{0%{transform:scale(.9)}45%{transform:scale(1.25);opacity:.6}100%{transform:none;opacity:1}}
.ai .glyph{width:100%;height:100%;border-radius:26%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));position:relative;z-index:1}
.ai .glyph .ic{width:52%;height:52%;color:#fff}
/* carpeta */
.fold{width:100%;height:100%;border-radius:26%;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8%;padding:14%;position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.fold img,.fold .glyph{width:100%;height:100%;min-height:0;border-radius:24%;object-fit:cover}
/* edición */
body.editing .ai .ic2{animation:wig .28s linear infinite;animation-delay:calc(var(--k,0) * -37ms)}
.ai .rm{position:absolute;top:-6px;left:calc(50% - var(--isz) / 2 - 6px);width:22px;height:22px;border-radius:50%;background:rgba(40,40,40,.85);color:#fff;font-size:15px;line-height:22px;text-align:center;z-index:3;display:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.editing .ai .rm{display:block}
.ai.drag{opacity:.25}
.ai.tgt .ic2{transform:scale(1.12);box-shadow:0 0 0 3px var(--acc),0 0 22px var(--acc);border-radius:28%}
#ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));display:none}
#editbar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 8px) 16px 8px;transform:translateY(-120%);transition:transform .4s var(--eo)}
body.editing #editbar{transform:none}
#editbar button{padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-weight:700;font-size:14px}
#editbar #eDone{background:linear-gradient(135deg,var(--acc),var(--acc2))}
#editbar .mid{display:flex;gap:8px}
#editbar .mid button{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%}
/* puntos de página, búsqueda, dock */
#dots{display:flex;justify-content:center;gap:7px;margin:4px 0 10px;flex:none}
#dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:.3s}
#dots i.on{width:18px;background:#fff}
#dots i.fd{width:6px;background:none;border:1.5px solid rgba(255,255,255,.6)}
#srch{align-self:center;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 14px;border-radius:17px;margin-bottom:12px;flex:none;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-weight:600;font-size:13.5px}
#srch .ic{width:16px;height:16px}
#srch .orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,color-mix(in srgb,var(--acc2) 70%,#fff) 32%,var(--acc) 75%);box-shadow:0 0 12px var(--acc);position:relative}
#srch .orb::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.3px dashed rgba(255,255,255,.75);animation:spin 8s linear infinite}
#dock{margin:0 12px calc(var(--sab) + 10px);padding:12px 10px;border-radius:32px;display:grid;grid-template-columns:repeat(var(--dn,4),1fr);gap:6px;flex:none;position:relative;min-height:calc(var(--isz) + 24px);
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.25);overflow:hidden}
#dock::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(60% 120% at calc(50% + var(--tx) * 6) -20%,rgba(255,255,255,.35),transparent 60%)}
#dock .ai small{display:none}
body.glow #dock{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent),0 10px 40px color-mix(in srgb,var(--acc) 30%,transparent)}

/* ===== widgets ===== */
.wg{position:relative;border-radius:28px;aspect-ratio:1;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .25s var(--sp)}
.wg:active{transform:scale(.96)}
.glass{background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(80% 60% at calc(30% + var(--tx) * 5) calc(0% + var(--ty) * 4),rgba(255,255,255,.28),transparent 60%)}
body.glow .wg.glass{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 8px 30px color-mix(in srgb,var(--acc) 22%,transparent)}
.wclock{background:#F3EEE7;color:#16130F;align-items:center;justify-content:center}
.wclock svg{position:absolute;inset:0;width:100%;height:100%}
.wclock b{font:800 52px/1 "Barlow Condensed",sans-serif;letter-spacing:-.01em;position:relative}
.wclock small{font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.55;position:relative;margin-top:4px}
.wwx{padding:14px 15px}
.wwx .c{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.wwx .c .ic{width:12px;height:12px}
.wwx .t{display:flex;align-items:flex-start;justify-content:space-between;margin-top:2px}
.wwx .t b{font:300 40px/1 Barlow;letter-spacing:-.02em}
.wwx .t span{font-size:26px}
.wwx .l{font-size:11.5px;line-height:1.35;margin-top:auto;opacity:.92}
.wwx .l b{font-weight:700}
.wmu{aspect-ratio:auto;height:96px;flex-direction:row;align-items:center;gap:12px;padding:12px}
.wmu .art{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.2) center/cover;flex:none;display:grid;place-items:center}
.wmu .tx{flex:1;min-width:0}
.wmu .tx small{font:600 9.5px var(--mono);letter-spacing:.2em;opacity:.7}
.wmu .tx b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmu .tx span{display:block;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmu .ctl{display:flex;gap:4px}
.wmu .ctl button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.wmu .ctl .pp{background:#fff;color:#111}
.wmu .ctl .ic{width:18px;height:18px}
.wbat{align-items:center;justify-content:center}
.wbat svg{width:70%;height:70%}
.wbat .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wbat .v b{font:800 30px "Barlow Condensed",sans-serif}
.wbat .v small{font:600 9.5px var(--mono);letter-spacing:.16em;opacity:.75}
.wev{padding:15px}
.wev small{font:600 9.5px var(--mono);letter-spacing:.18em;opacity:.75}
.wev b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font:800 20px/1.1 "Barlow Condensed",sans-serif;margin-top:8px}
.wev span{margin-top:auto;font-size:12px;opacity:.9}
.wev .n{font:800 34px/1 "Barlow Condensed",sans-serif;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.page.in .wg,.page.in .ai{animation:popIn .5s var(--sp) both;animation-delay:calc(var(--k,0) * 28ms)}

/* ===== cajón ===== */
#drawer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 10px);transform:translateY(105%);transition:transform .46s var(--eo);will-change:transform}
body.drawerOpen #drawer{transform:none}
#drawer.drag{transition:none}
.dtop{padding:4px 18px 8px;flex:none}
.dsr{position:relative;display:flex;align-items:center;gap:10px}
.dsr input{flex:1;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;padding:0 16px 0 42px;font-size:15.5px;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.dsr input::placeholder{color:rgba(255,255,255,.6)}
#dsI{position:absolute;left:14px;top:13px;width:18px;height:18px;opacity:.7;pointer-events:none}#dsI .ic{width:18px;height:18px}
.dsr .orb{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 10%,color-mix(in srgb,var(--acc2) 70%,#fff) 30%,var(--acc) 75%);box-shadow:0 0 18px var(--acc)}
.dcnt{font:600 10px var(--mono);letter-spacing:.2em;opacity:.6;margin:12px 4px 0;text-transform:uppercase}
.dbody{flex:1;overflow-y:auto;padding:4px 26px calc(var(--sab) + 30px) 16px;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.dbody::-webkit-scrollbar{display:none}
.lt{font:800 18px "Barlow Condensed",sans-serif;margin:16px 0 10px 4px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;content-visibility:auto;contain-intrinsic-size:auto 180px}
.az{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;font:700 10px Barlow;color:rgba(255,255,255,.65);z-index:5;touch-action:none;padding:6px 2px}
.az span{padding:.6px 4px;line-height:1.28}
.azb{position:absolute;right:40px;top:45%;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font:800 32px "Barlow Condensed";opacity:0;transform:scale(.6);transition:.18s;pointer-events:none;z-index:6}
.azb.on{opacity:1;transform:none}
.hidb{display:block;margin:22px auto 0;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.12)}
body.drawerOpen .dg .ai{animation:popIn .45s var(--sp) both}

/* ===== carpeta líquida ===== */
#folder{position:fixed;inset:0;z-index:40;pointer-events:none}
#folder.on{pointer-events:auto}
#folder .fbg{position:absolute;inset:0}
#fblob{position:fixed;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.35);opacity:0}
#fpanel{position:fixed;left:50%;top:50%;width:300px;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;pointer-events:none}
#folder.show #fpanel{opacity:1;pointer-events:auto;transition-delay:.18s}
#fpanel input{display:block;width:100%;background:none;border:0;outline:none;color:#fff;font:800 26px "Barlow Condensed",sans-serif;text-align:center;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
#fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:20px 16px}

/* ===== hojas, menú ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s;z-index:70}
body.sheetOpen #scrim{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + 8px);max-height:84dvh;overflow-y:auto;background:rgba(22,24,30,.92);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);color:#F2F4F8;border-radius:30px;z-index:71;transform:translateY(calc(100% + var(--sab) + 40px));visibility:hidden;transition:transform .42s var(--eo),visibility 0s .42s;padding:10px 18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);scrollbar-width:none}
body.sheetOpen #sheet{transform:none;visibility:visible;transition:transform .42s var(--eo)}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
#sheet h3{font-size:17px;font-weight:700;text-align:center;margin:2px 0 14px;position:relative}
#sheet h3 .x{position:absolute;left:0;top:-4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;opacity:.8}
#sheet h4{font:600 10px var(--mono);letter-spacing:.18em;color:#8F99A9;text-transform:uppercase;margin:18px 4px 8px}
.grp{background:rgba(255,255,255,.06);border-radius:18px;padding:2px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:11.5px;font-weight:500;color:#8F99A9;margin-top:2px}
.row.link{color:color-mix(in srgb,var(--acc) 80%,#fff)}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.25s var(--sp)}
.sw.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}.sw.on::after{left:23px}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:9px;font-weight:700;font-size:12.5px;color:#C9D2DE}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.fld{display:block;margin:8px 0}
.fld span{display:block;font-size:11.5px;font-weight:600;color:#8F99A9;margin-bottom:4px}
.fld input,.fld select{width:100%;border:0;border-radius:12px;background:rgba(255,255,255,.08);padding:11px 12px;font-size:15px;color:#fff;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px}
.btn.alt{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn .ic{width:18px;height:18px}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.walls button{aspect-ratio:9/16;border-radius:12px;background:#222 center/cover;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.walls button.on{box-shadow:0 0 0 2.5px #fff,0 0 16px var(--acc)}
.walls button span{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 5px;font-size:10px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.pal{display:flex;flex-wrap:wrap;gap:12px;padding:6px 2px}
.pal button{width:32px;height:32px;border-radius:50%;background:var(--c)}
.pal button.on{box-shadow:0 0 0 3px #16181e,0 0 0 5px var(--cr),0 0 14px var(--cr)}
.song,.hrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.song .th{width:40px;height:40px;flex:none}.song .th img{width:100%;height:100%;border-radius:10px}
.song .tx{flex:1;min-width:0}.song b{display:block;font-size:14px}.song small{font-size:11px;color:#8F99A9}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.empty{text-align:center;color:#8F99A9;font-size:13px;padding:16px}
#ctx{position:fixed;inset:0;z-index:50;pointer-events:none}
#ctx .cbg{position:absolute;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .25s}
#ctx.on{pointer-events:auto}#ctx.on .cbg{opacity:1}
#ctx .clone{position:fixed;margin:0;transition:transform .35s var(--sp);z-index:2;pointer-events:none}
#ctx.on .clone{transform:scale(1.1)}
.cm{position:fixed;width:256px;max-height:66dvh;overflow-y:auto;background:rgba(28,30,36,.9);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);padding:6px;opacity:0;transform:scale(.55);transition:transform .38s var(--sp),opacity .2s;z-index:3;scrollbar-width:none}
#ctx.on .cm{opacity:1;transform:none}
.cmh{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.cmh img{width:38px;height:38px;border-radius:10px}
.cmh b{display:block;font-size:15px}.cmh small{font-size:11px;color:#8F99A9}
.cmr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;font-size:14.5px;text-align:left;color:#F2F4F8}
.cmr:active{background:rgba(255,255,255,.08)}
.cmr .ic,.cmr img{width:19px;height:19px;flex:none;border-radius:5px}
.cmr.red{color:#ff6b72}
.cms{height:1px;background:rgba(255,255,255,.08);margin:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 120px);transform:translate(-50%,20px);background:rgba(20,22,28,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:86vw;text-align:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:spin 1s linear infinite}
/* ===================== HOLO: cristal + 3D holográfico ===================== */
@font-face{font-family:'Orbitron';font-weight:500;font-display:swap;src:url(fonts/orbitron-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Orbitron';font-weight:700;font-display:swap;src:url(fonts/orbitron-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Orbitron';font-weight:900;font-display:swap;src:url(fonts/orbitron-latin-900-normal.woff2) format('woff2')}
@property --ang{syntax:'<angle>';inherits:true;initial-value:0deg}
@keyframes holoSpin{to{--ang:360deg}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes gridRun{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,40px,0)}}
@keyframes part{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate3d(var(--dx),-55vh,0);opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes flipIn{from{opacity:0;transform:perspective(500px) rotateX(-70deg) translateY(20px)}to{opacity:1;transform:none}}
@keyframes holoIn{0%{opacity:0;transform:perspective(700px) rotateX(25deg) translateZ(-120px);filter:blur(6px)}60%{opacity:1;filter:none}100%{opacity:1;transform:none}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.55}96%{opacity:1}}
:root{--h1:#00F0FF;--h2:#FF2BD6;--h3:#7B5CFF;--h4:#B6FF3B;--h5:#FFB86B;--nx:0;--ny:0;
  --iri:conic-gradient(from var(--ang),#00F0FF,#7B5CFF,#FF2BD6,#FFB86B,#B6FF3B,#00F0FF);
  --hf:Orbitron,"Barlow Condensed",sans-serif;animation:holoSpin 9s linear infinite}
body.nohfx{--ang:0deg}
:root:has(body.nohfx){animation:none}

/* capas de ambiente */
#floor{position:fixed;left:-30%;right:-30%;bottom:-6%;height:42%;z-index:1;pointer-events:none;perspective:340px;perspective-origin:50% 0;opacity:.75;
  -webkit-mask:linear-gradient(transparent,#000 35%,#000 70%,transparent);mask:linear-gradient(transparent,#000 35%,#000 70%,transparent);
  transform:translate3d(calc(var(--nx) * -14px),0,0)}
#floor i{position:absolute;left:0;right:0;top:-40px;bottom:-40px;transform-origin:50% 0;transform:rotateX(64deg)}
#floor i::before{content:"";position:absolute;inset:0;background:
  linear-gradient(color-mix(in srgb,var(--acc) 70%,transparent) 1.2px,transparent 1.2px) 0 0/40px 40px,
  linear-gradient(90deg,color-mix(in srgb,var(--acc2) 65%,transparent) 1.2px,transparent 1.2px) 0 0/40px 40px;animation:gridRun 2.6s linear infinite;
  filter:drop-shadow(0 0 3px var(--acc))}
body.nohfx #floor i::before{animation:none}
body.drawerOpen #floor,body.folderOpen #floor{opacity:.25}
#parts{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#parts b{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 2px #fff;animation:part var(--t) linear infinite;animation-delay:var(--d)}
body.nohfx #parts{display:none}
#shade{background:radial-gradient(120% 60% at 50% 0%,transparent 40%,rgba(0,0,0,.35)),linear-gradient(180deg,rgba(0,0,0,.3),transparent 18%,transparent 70%,rgba(0,0,0,.45))}

/* cristal holográfico base */
.glass,.holo{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(120,90,255,.08));
  -webkit-backdrop-filter:blur(22px) saturate(1.9) brightness(1.05);backdrop-filter:blur(22px) saturate(1.9) brightness(1.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 18px 40px -12px rgba(0,0,0,.55),0 0 30px -8px color-mix(in srgb,var(--acc) 45%,transparent)}
.glass::after,.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;pointer-events:none;background:var(--iri);opacity:.9;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:overlay;opacity:.42;
  background:linear-gradient(115deg,transparent 22%,rgba(0,240,255,.55) 36%,rgba(255,43,214,.5) 46%,rgba(255,255,255,.75) 50%,rgba(182,255,59,.45) 56%,transparent 70%) no-repeat;
  background-size:260% 260%;background-position:calc(50% + var(--nx) * 40% + (var(--px,.5) - .5) * 90%) calc(50% + var(--ny) * 40% + (var(--py,.5) - .5) * 90%)}

/* widgets 3D */
#pager{perspective:1100px}
.wrow{gap:14px}
.wg{border-radius:30px;transform-style:flat;--s:1;
  transform:rotateX(calc(var(--ny) * -7deg + var(--ly,0) * -12deg)) rotateY(calc(var(--nx) * 9deg + var(--lx,0) * 14deg)) scale(var(--s));transition:transform .35s var(--sp)}
.wg.tch{transition:transform .08s linear}
.wg:active{transform:rotateX(calc(var(--ny) * -7deg + var(--ly,0) * -12deg)) rotateY(calc(var(--nx) * 9deg + var(--lx,0) * 14deg)) scale(.965)}
.wg .dz{transform:translate3d(calc(var(--nx) * 5px + var(--lx,0) * 6px),calc(var(--ny) * 5px + var(--ly,0) * 6px),0);transition:transform .2s}
.hn{font-family:var(--hf);font-weight:900;letter-spacing:.02em;background:linear-gradient(180deg,#fff 0%,#E8F6FF 38%,color-mix(in srgb,var(--acc) 80%,#fff) 62%,var(--acc2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc) 65%,transparent)) drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.lab{font:500 9.5px var(--hf);letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--acc) 55%,#fff);opacity:.9}

/* reloj holográfico */
.wclock{color:#fff;background:linear-gradient(150deg,rgba(20,14,50,.55),rgba(8,6,24,.35));align-items:center;justify-content:center;overflow:hidden}
.wclock .rings{position:absolute;inset:14% 10% 30%;opacity:.8;perspective:260px;pointer-events:none}
.wclock .rings i{position:absolute;inset:8%;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--acc) 75%,transparent);box-shadow:0 0 12px var(--acc),inset 0 0 12px color-mix(in srgb,var(--acc) 50%,transparent);
  transform:rotateX(72deg) rotateZ(var(--ang))}
.wclock .rings i:nth-child(2){inset:16%;border-color:color-mix(in srgb,var(--acc2) 80%,transparent);box-shadow:0 0 12px var(--acc2);border-style:dashed;transform:rotateY(70deg) rotateZ(calc(var(--ang) * -2))}
.wclock .rings i:nth-child(3){inset:24%;border-width:1px;border-color:rgba(255,255,255,.4);box-shadow:none;transform:rotateX(60deg) rotateY(40deg) rotateZ(calc(var(--ang) * 3))}
.wclock svg{position:absolute;inset:0;width:100%;height:100%}
.wclock b{font-size:40px;line-height:1;position:relative;animation:flick 7s infinite}
.wclock small{position:relative;margin-top:10px;text-shadow:0 0 6px rgba(0,0,0,.9)}
.wclock .scan{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:0}
.wclock .scan::before{content:"";position:absolute;left:0;right:0;height:40%;background:linear-gradient(transparent,color-mix(in srgb,var(--acc) 22%,transparent),transparent);animation:scan 3.6s linear infinite}
.wclock .scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
body.nohfx .wclock .scan::before{animation:none;display:none}

/* clima */
.wwx .c{font:700 12px var(--hf);letter-spacing:.06em}
.wwx .t b{font-size:38px}
.wwx .t span{font-size:30px;animation:floatY 4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4)) drop-shadow(0 0 12px color-mix(in srgb,var(--acc) 60%,transparent))}
.wwx .l{font-size:11px}
.wwx .l b{font:700 11px var(--hf);letter-spacing:.05em;color:color-mix(in srgb,var(--acc) 50%,#fff)}

/* música */
.wmu{height:104px}
.wmu .art{position:relative;border-radius:20px;box-shadow:0 0 0 1.5px rgba(255,255,255,.25),0 10px 22px rgba(0,0,0,.45),0 0 20px color-mix(in srgb,var(--acc) 40%,transparent)}
.wmu .art::after{content:"";position:absolute;inset:-5px;border-radius:24px;padding:1.5px;background:var(--iri);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.wmu .tx b{font-weight:700}
.wmu .eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-left:6px;vertical-align:-1px}
.wmu .eq i{width:2.5px;height:100%;background:var(--acc);border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.wmu .eq i:nth-child(2){animation-delay:-.3s;background:var(--acc2)}.wmu .eq i:nth-child(3){animation-delay:-.6s}
.wmu .ctl .pp{background:var(--iri);color:#05040f;box-shadow:0 0 16px color-mix(in srgb,var(--acc) 70%,transparent)}

/* batería / evento */
.wbat .v b{font-size:24px}
.wbat svg{filter:drop-shadow(0 0 6px var(--acc))}
.wev b{font-family:Barlow;font-weight:700;font-size:18px;line-height:1.15}
.wev .n{font-family:var(--hf);font-size:30px}

/* íconos: placa de cristal + brillo + 3D */
.grid{gap:18px 6px}
.ai .ic2{transform:rotateX(calc(var(--ny) * -10deg)) rotateY(calc(var(--nx) * 12deg));transition:transform .3s var(--sp)}
.ai:active .ic2,.ai.prs .ic2{transform:translateY(2px) scale(.86)}
.ai .ic2 img,.ai .ic2 .glyph{box-shadow:0 0 0 1px rgba(255,255,255,.22),0 8px 16px -4px rgba(0,0,0,.55)}
.ai .ic2::after{content:"";position:absolute;inset:0;border-radius:26%;z-index:2;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(125deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 38%,rgba(0,240,255,.35) 55%,rgba(255,43,214,.35) 70%,rgba(255,255,255,0) 85%);
  background-size:220% 220%;background-position:calc(50% + var(--nx) * 50%) calc(50% + var(--ny) * 50%);opacity:.45}
body.glow .ai .ic2::after{box-shadow:none}
.ai .ic2::before{content:"";position:absolute;left:12%;right:12%;bottom:-9px;height:8px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--g,var(--acc)) 70%,transparent),transparent);filter:blur(2px);opacity:.8}
.ai small{font-weight:600;letter-spacing:.01em;text-shadow:0 0 8px rgba(0,0,0,.8),0 1px 2px rgba(0,0,0,.9)}
.ai .glyph{background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc2))}

/* carpeta */
.fold{background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.fold::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:var(--iri);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#fblob{background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(120,90,255,.1))}
#fblob::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--iri);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#fpanel input{font:900 22px var(--hf);letter-spacing:.06em}

/* puntos, búsqueda, dock */
#dots i{height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
#dots i.on{width:22px;background:var(--iri);box-shadow:0 0 10px var(--acc)}
#srch{height:38px;border-radius:19px;padding:0 6px 0 16px;font:500 12px var(--hf);letter-spacing:.14em;text-transform:uppercase}
#srch .orb{width:28px;height:28px;background:radial-gradient(circle at 35% 30%,#fff 0 10%,transparent 34%),var(--iri);box-shadow:0 0 14px var(--acc),0 0 26px var(--acc2)}
#dock{border-radius:34px;padding:12px 12px 14px;overflow:visible;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));}
#dock::before{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc) 90%,#fff),transparent) top/70% 1.5px no-repeat;filter:drop-shadow(0 0 6px var(--acc));border-radius:inherit}
#dock .ai .ic2{-webkit-box-reflect:below 8px linear-gradient(transparent 55%,rgba(255,255,255,.22))}
#dock .ai .ic2::before{display:none}
#dockpad{position:fixed;left:10%;right:10%;bottom:calc(var(--sab) - 18px);height:40px;z-index:2;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 55%,transparent),color-mix(in srgb,var(--acc2) 25%,transparent) 60%,transparent);filter:blur(6px);opacity:.8;transition:opacity .3s}
body.drawerOpen #dockpad,body.folderOpen #dockpad{opacity:0}

/* edición */
#editbar button{font:700 12px var(--hf);letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
#editbar #eDone{background:var(--iri);color:#05040f}
.ai .rm{background:rgba(10,10,25,.75);box-shadow:0 0 0 1px var(--acc),0 0 10px var(--acc)}

/* cajón */
#drawer{background:linear-gradient(180deg,rgba(6,4,20,.55),rgba(6,4,20,.8))}
#drawer::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
.dsr input{border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent),0 0 18px -6px var(--acc);font-weight:600}
.dsr .orb{border-radius:16px;background:radial-gradient(circle at 35% 30%,#fff 0 8%,transparent 30%),var(--iri)}
.dcnt{font-family:var(--hf);color:color-mix(in srgb,var(--acc) 60%,#fff)}
.lt{font:900 16px var(--hf);background:var(--iri);-webkit-background-clip:text;background-clip:text;display:flex;align-items:center;gap:10px;width:auto}
.lt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,transparent),transparent)}
body.drawerOpen .dg .ai{animation:flipIn .5s var(--sp) both}
.azb{border-radius:18px;background:rgba(10,8,30,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:var(--hf);box-shadow:inset 0 0 0 1.5px var(--acc),0 0 22px var(--acc)}
.az{font-family:var(--hf);font-size:8.5px}

/* hojas y menú */
#sheet,.cm{background:linear-gradient(160deg,rgba(28,24,52,.9),rgba(10,8,22,.94))}
#sheet::after,.cm::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;background:var(--iri);opacity:.75;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#sheet h3{font:700 15px var(--hf);letter-spacing:.06em}
#sheet h4{font-family:var(--hf);color:color-mix(in srgb,var(--acc) 60%,#fff)}
.grp{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sw.on,.seg button.on,.btn{background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 0 14px -2px var(--acc)}
.cmh b{font-family:var(--hf);font-size:13px;letter-spacing:.04em}
.page.in .wg{animation:holoIn .7s var(--eo) both;animation-delay:calc(var(--k,0) * 60ms)}
.page.in .ai{animation:flipIn .55s var(--sp) both;animation-delay:calc(120ms + var(--k,0) * 26ms)}
#toast{font-family:Barlow;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 50%,transparent),0 0 20px -4px var(--acc)}

/* noticias (adaptado) */
/* ===== panel de noticias ===== */
#feed{position:fixed;inset:0;z-index:35;background:var(--bg);transform:translateX(-102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;will-change:transform;box-shadow:12px 0 40px rgba(0,0,0,.25)}
#feed.drag{transition:none}
body.feedOpen #feed{transform:none}
#fshade{position:fixed;inset:0;z-index:34;background:#000;opacity:0;pointer-events:none;transition:opacity .42s}
body.feedOpen #fshade{opacity:.35;pointer-events:auto}
.fh{background:var(--acc);color:var(--on);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-radius:0 0 24px 24px;flex:none;transition:background-color .55s}
.fh .row1{display:flex;align-items:flex-end;justify-content:space-between}
.fh b{font:400 46px/0.95 Anton,Impact,sans-serif;color:transparent;-webkit-text-stroke:1.4px var(--on);letter-spacing:.02em}
.fh small{display:block;font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-top:4px}
.fh .fb{display:flex;gap:8px}
.fh .fb button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:var(--on)}
.fh .fb .ic{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:16px;background:rgba(255,255,255,.12);font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--on);transition:background .25s,color .25s}
.chip.on{background:var(--on);color:var(--acc)}
.fl{flex:1;overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain;scrollbar-width:none;position:relative}
.fl::-webkit-scrollbar{display:none}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--mut);transition:height .25s}
.ptr .ic{width:22px;height:22px}
.nhero{display:block;width:100%;text-align:left;margin-bottom:14px;border-radius:20px;overflow:hidden;background:var(--tile);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.nhero .im{width:100%;aspect-ratio:16/9;background:#d8d4dc center/cover}
.nhero .tx{padding:12px 14px 14px}
.nhero b{display:block;font:800 20px/1.15 "Barlow Condensed",sans-serif}
.nsrc{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);margin-bottom:5px;white-space:nowrap;overflow:hidden}
.nsrc img{width:16px;height:16px;border-radius:4px;flex:none;background:#ddd}
.nitem{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid #dcd7df;align-items:flex-start}
.nitem .tx{flex:1;min-width:0}
.nitem b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font:700 16px/1.22 "Barlow Condensed",sans-serif}
.nitem .im{width:86px;height:86px;border-radius:14px;flex:none;background:#d8d4dc center/cover}
.nitem:active,.nhero:active{opacity:.7}

.jvorb .core{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0 8%,color-mix(in srgb,var(--acc) 60%,#fff) 25%,var(--acc) 55%,color-mix(in srgb,var(--acc2) 80%,#000) 100%);box-shadow:0 0 30px var(--acc),0 0 70px color-mix(in srgb,var(--acc2) 70%,transparent),inset 0 0 18px rgba(255,255,255,.6);transform:scale(calc(1 + var(--lv) * .45));transition:transform .08s linear}

  const urls=[gnUrl(NTOP[k])];if(k===0&&EXTRA_SRC[S.lang])urls.push(EXTRA_SRC[S.lang]);
  const lists=await Promise.all(urls.map(feedFetch));$('#fR').classList.remove('spin');
  let items=[];lists.forEach(l=>{if(Array.isArray(l))items=items.concat(l)});
  if(!items.length){if(!FEED[k])$('#fitems').innerHTML=`<p class="nmsg">${esc(T().nwErr)}</p>`;return}
  const seen=new Set();items=items.filter(x=>{const t=(x.t||'').toLowerCase().slice(0,60);if(!t||seen.has(t))return false;seen.add(t);return true});
  items.forEach(x=>{if(x.s&&x.t.endsWith(' - '+x.s))x.t=x.t.slice(0,-(x.s.length+3))});
  items.sort((a,b)=>(b.d||0)-(a.d||0));
  if(k===0){const wi=items.filter(x=>x.img),wo=items.filter(x=>!x.img);const mix=[];while(wi.length||wo.length){if(wi.length)mix.push(wi.shift());for(let n=0;n<2&&wo.length;n++)mix.push(wo.shift())}items=mix}
  items=items.slice(0,60);FEED[k]=items;try{localStorage.setItem(key,JSON.stringify({t:Date.now(),items}))}catch(e){}
  renderFeed(true)}
function renderFeed(anim){const t=T(),k=S.feedTopic|0;
  $('#fT').textContent=t.news.toUpperCase();$('#fD').textContent=cap(fmt(new Date(),{weekday:'long',day:'numeric',month:'long'}));
  $('#chips').innerHTML=t.topics.map((x,i)=>`<button class="chip ${i===k?'on':''}" data-t="${i}">${esc(x)}</button>`).join('');
  if(!NATIVE){$('#fitems').innerHTML=`<p class="nmsg">${esc(t.nwOnly)}</p>`;return}
  const it=FEED[k];if(!it)return;
  const fav=x=>{const h=host(x.su||x.l);return h?`<img src="https://www.google.com/s2/favicons?domain=${h}&sz=64" alt="" loading="lazy">`:''};
  const src=x=>`<div class="nsrc">${fav(x)}<span>${esc(x.s||host(x.l))}</span><span>· ${esc(relT(x.d||Date.now()))}</span></div>`;
  let h='';it.forEach((x,i)=>{const d=`style="--d:${Math.min(i,10)}"`;
    if(i===0&&x.img)h+=`<button class="nhero" data-u="${esc(x.l)}" data-ti="${esc(x.t)}" ${d}><div class="im" style="background-image:url('${esc(x.img)}')"></div><div class="tx">${src(x)}<b>${esc(x.t)}</b></div></button>`;
    else h+=`<button class="nitem" data-u="${esc(x.l)}" data-ti="${esc(x.t)}" ${d}><div class="tx">${src(x)}<b>${esc(x.t)}</b></div>${x.img?`<div class="im" style="background-image:url('${esc(x.img)}')"></div>`:''}</button>`});
  $('#fitems').innerHTML=h;if(anim){const f=$('#feed');f.classList.remove('in');void f.offsetWidth;f.classList.add('in')}}
function openFeedPrep(){if(!openFeedPrep._r){openFeedPrep._r=1;$('#fR').innerHTML=ic('sync');$('#fX').innerHTML=ic('left');renderFeed()}}
function openFeed(){openFeedPrep();document.body.classList.add('feedOpen');hap('tick');const f=$('#feed');f.classList.remove('in');void f.offsetWidth;f.classList.add('in');loadFeed(false)}
function closeFeed(){document.body.classList.remove('feedOpen')}
$('#fX').onclick=closeFeed;$('#fshade').onclick=closeFeed;$('#fR').onclick=()=>{hap();loadFeed(true)};
$('#chips').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;hap('tick');S.feedTopic=+b.dataset.t;save();$('#fl').scrollTop=0;FEED[S.feedTopic]?renderFeed(true):renderFeed();loadFeed(false)};
(()=>{let lt=null,lp=false;
  $('#fitems').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-u]');if(!b)return;lp=false;clearTimeout(lt);lt=setTimeout(()=>{lp=true;hap('long');if(has('shareText'))Android.shareText(b.dataset.ti+'\n'+b.dataset.u)},520)});
  ['pointerup','pointercancel','pointermove'].forEach(v=>$('#fitems').addEventListener(v,e=>{if(v!=='pointermove'||Math.abs(e.movementY)>3)clearTimeout(lt)},{passive:true}));
  $('#fitems').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b||lp)return;hap();if(has('openArticle'))Android.openArticle(b.dataset.u,S.acc);else if(NATIVE)Android.openUrl(b.dataset.u);else window.open(b.dataset.u,'_blank')})})();
/* cerrar deslizando a la izquierda + deslizar para actualizar */
(()=>{const f=$('#feed'),fl=$('#fl'),ptr=$('#ptr');let sx=0,sy=0,lock=0,dx=0,dy=0;
  f.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;lock=0;dx=dy=0;if(e.target.closest('.chips'))lock=-1},{passive:true});
  f.addEventListener('touchmove',e=>{if(lock<0)return;const t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;
    if(!lock){if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.3){lock=1;f.classList.add('drag')}else if(dy>12&&fl.scrollTop<=0&&Math.abs(dy)>Math.abs(dx)){lock=2;ptr.innerHTML=ic('sync');ptr.style.transition='none'}else if(Math.abs(dy)>12||Math.abs(dx)>12){lock=-1;return}else return}
    e.preventDefault();if(lock===1){f.style.transform=`translateX(${Math.min(0,dx)}px)`;$('#fshade').style.opacity=Math.max(0,.35+dx/innerWidth*.35)}
    else{const h=Math.min(70,dy*.45);ptr.style.height=h+'px';ptr.firstChild&&(ptr.firstChild.style.transform=`rotate(${dy*2}deg)`)}},{passive:false});
  const end=()=>{if(lock===1){f.classList.remove('drag');f.style.transform='';$('#fshade').style.opacity='';if(dx<-innerWidth*.25)closeFeed()}
    else if(lock===2){ptr.style.transition='';if(dy*.45>=60){ptr.style.height='44px';ptr.firstChild&&ptr.firstChild.classList.add('spin');hap();loadFeed(true).then(()=>{ptr.style.height='0'})}else ptr.style.height='0'}lock=0};
  f.addEventListener('touchend',end,{passive:true});f.addEventListener('touchcancel',end,{passive:true})})();

window.onAndroidBack=()=>{if(document.body.classList.contains('sheetOpen'))closeSheet();else if(JV.on)jvClose();else if($('#ctx').classList.contains('on'))closeCtx();else if(OPENF)closeFolder();else if(document.body.classList.contains('feedOpen'))closeFeed();
  else if(document.body.classList.contains('drawerOpen'))closeDrawer();else if(document.body.classList.contains('editing'))endEdit(true);else if((S.page|0)!==0)goPage(0)};
window.onAndroidHome=()=>{if(JV.on){jvClose();return}if(document.body.classList.contains('sheetOpen'))closeSheet();closeCtx();if(OPENF)closeFolder();if(document.body.classList.contains('feedOpen'))closeFeed();
  if(document.body.classList.contains('drawerOpen')){closeDrawer();return}if(document.body.classList.contains('editing')){endEdit(true);return}if((S.page|0)!==0)goPage(0);else animIn()};
window.onAndroidResume=()=>{renderGCard();schedTick();refreshLive();animIn();tiltSetup()};
window.addEventListener('resize',()=>layoutPages(S.page|0));
if(!S.pages||!S.dock)defaultLayout();cleanLayout();
applyTheme();applyWall();renderHome(true);schedTick();
if(NATIVE){nativeDev();setInterval(()=>{if(!document.hidden&&(S.page|0)===1){nativeDev();refreshWidgets()}},30000)}
pollMedia();refreshNEV(true);if(S.wxLoc)loadWx(false);else setTimeout(()=>geoLocate(true),1500);
if(NATIVE&&has('gestureStatus')&&!S.gAsked){try{Android.setGestureConfig(JSON.stringify({mode:'transparent',pill:true}))}catch(e){}}
if(NATIVE&&!S.homeAsked){S.homeAsked=true;save();try{if(!Android.isDefaultLauncher())setTimeout(()=>{const t=T();sheet(`<h3>Aura</h3><p style="font-size:14px;margin-bottom:14px;text-align:center">${esc(t.homeHint)}</p><div style="display:flex;gap:10px"><button class="btn alt" data-x style="flex:1">${esc(t.cancel)}</button><button class="btn" id="hm2" style="flex:1">OK</button></div>`);$('#hm2').onclick=()=>{closeSheet();Android.setDefaultLauncher()}},1500)}catch(e){}}
else if(NATIVE&&!S.gAsked){S.gAsked=true;save();try{const g=gStatus();if(g&&!g.service)setTimeout(gestureSheet,1500)}catch(e){}}
$('#eAdd').innerHTML=ic('plus');$('#eSet').innerHTML=ic('sliders');$('#srchT').textContent=T().search;$('#eCancel').textContent=T().cancel;$('#eDone').textContent=T().done;
