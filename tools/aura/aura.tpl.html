<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Aura</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
:root{--acc:#22D3EE;--acc2:#3B82F6;--on:#fff;--bg:#0B0F16;--tile:#151B25;--ink:#EEF2F8;--mut:#8F99A9;--mono:JB,ui-monospace,monospace;--sat:28px;--sab:16px;--isz:58px;--eo:cubic-bezier(.2,.9,.25,1);--sp:cubic-bezier(.3,1.45,.5,1);--tx:0px;--ty:0px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;font-family:Barlow,Roboto,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
.ic{width:22px;height:22px;flex:none}
img{-webkit-user-drag:none;user-drag:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes aUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes wig{0%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}100%{transform:rotate(-1.6deg)}}

/* ===== fondo + inclinación ===== */
#wall{position:fixed;inset:-24px;z-index:0;background:#111 center/cover no-repeat;transform:translate3d(calc(var(--tx) * -1.6),calc(var(--ty) * -1.6),0) scale(1.04);transition:filter .45s,transform .12s linear;will-change:transform}
body.drawerOpen #wall{filter:blur(22px) brightness(.55) saturate(1.3)}
body.folderOpen #wall,body.editing #wall{filter:blur(8px) brightness(.7)}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 22%,transparent 62%,rgba(0,0,0,.42))}

/* ===== inicio ===== */
#home{position:fixed;inset:0;z-index:2;padding-top:calc(var(--sat) + 14px);display:flex;flex-direction:column;transition:opacity .35s,transform .45s var(--eo)}
body.drawerOpen #home{opacity:0;transform:scale(.92)}
body.editing #home{padding-top:calc(var(--sat) + 62px)}
body.folderOpen #home{opacity:.25;transform:scale(.97)}
#pager{position:relative;flex:1;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;padding:0 20px;transform-origin:50% 50%;will-change:transform}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.wbig{grid-column:1/3}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:16px 6px}
.ai{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative;touch-action:none}
.ai .ic2{position:relative;width:var(--isz);height:var(--isz);border-radius:28%;transition:transform .25s var(--sp)}
.ai .ic2 img{position:relative;width:100%;height:100%;border-radius:26%;object-fit:cover;z-index:1;display:block}
.ai .ic2 .gl{position:absolute;inset:8%;border-radius:30%;background:var(--g,#888);filter:blur(13px);opacity:0;transform:translateY(6px) scale(1.05);transition:opacity .4s}
body.glow .ai .ic2 .gl{opacity:.85}
body.glow .ai .ic2::after{content:"";position:absolute;inset:0;border-radius:26%;z-index:2;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.12)}
.ai small{font-size:11.5px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.65);transition:opacity .3s}
body.nolabels .ai small{opacity:0}
.ai:active .ic2,.ai.prs .ic2{transform:scale(.86)}
.ai.lch .ic2{animation:lch .5s ease-out}
@keyframes lch{0%{transform:scale(.9)}45%{transform:scale(1.25);opacity:.6}100%{transform:none;opacity:1}}
.ai .glyph{width:100%;height:100%;border-radius:26%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));position:relative;z-index:1}
.ai .glyph .ic{width:52%;height:52%;color:#fff}
/* carpeta */
.fold{width:100%;height:100%;border-radius:26%;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8%;padding:14%;position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.fold img,.fold .glyph{width:100%;height:100%;min-height:0;border-radius:24%;object-fit:cover}
/* edición */
body.editing .ai .ic2{animation:wig .28s linear infinite;animation-delay:calc(var(--k,0) * -37ms)}
.ai .rm{position:absolute;top:-6px;left:calc(50% - var(--isz) / 2 - 6px);width:22px;height:22px;border-radius:50%;background:rgba(40,40,40,.85);color:#fff;font-size:15px;line-height:22px;text-align:center;z-index:3;display:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.editing .ai .rm{display:block}
.ai.drag{opacity:.25}
.ai.tgt .ic2{transform:scale(1.12);box-shadow:0 0 0 3px var(--acc),0 0 22px var(--acc);border-radius:28%}
#ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));display:none}
#editbar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 8px) 16px 8px;transform:translateY(-120%);transition:transform .4s var(--eo)}
body.editing #editbar{transform:none}
#editbar button{padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-weight:700;font-size:14px}
#editbar #eDone{background:linear-gradient(135deg,var(--acc),var(--acc2))}
#editbar .mid{display:flex;gap:8px}
#editbar .mid button{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%}
/* puntos de página, búsqueda, dock */
#dots{display:flex;justify-content:center;gap:7px;margin:4px 0 10px;flex:none}
#dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:.3s}
#dots i.on{width:18px;background:#fff}
#dots i.fd{width:6px;background:none;border:1.5px solid rgba(255,255,255,.6)}
#srch{align-self:center;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 14px;border-radius:17px;margin-bottom:12px;flex:none;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-weight:600;font-size:13.5px}
#srch .ic{width:16px;height:16px}
#srch .orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,color-mix(in srgb,var(--acc2) 70%,#fff) 32%,var(--acc) 75%);box-shadow:0 0 12px var(--acc);position:relative}
#srch .orb::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.3px dashed rgba(255,255,255,.75);animation:spin 8s linear infinite}
#dock{margin:0 12px calc(var(--sab) + 10px);padding:12px 10px;border-radius:32px;display:grid;grid-template-columns:repeat(var(--dn,4),1fr);gap:6px;flex:none;position:relative;min-height:calc(var(--isz) + 24px);
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.25);overflow:hidden}
#dock::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(60% 120% at calc(50% + var(--tx) * 6) -20%,rgba(255,255,255,.35),transparent 60%)}
#dock .ai small{display:none}
body.glow #dock{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent),0 10px 40px color-mix(in srgb,var(--acc) 30%,transparent)}

/* ===== widgets ===== */
.wg{position:relative;border-radius:28px;aspect-ratio:1;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .25s var(--sp)}
.wg:active{transform:scale(.96)}
.glass{background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(80% 60% at calc(30% + var(--tx) * 5) calc(0% + var(--ty) * 4),rgba(255,255,255,.28),transparent 60%)}
body.glow .wg.glass{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 8px 30px color-mix(in srgb,var(--acc) 22%,transparent)}
.wclock{background:#F3EEE7;color:#16130F;align-items:center;justify-content:center}
.wclock svg{position:absolute;inset:0;width:100%;height:100%}
.wclock b{font:800 52px/1 "Barlow Condensed",sans-serif;letter-spacing:-.01em;position:relative}
.wclock small{font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.55;position:relative;margin-top:4px}
.wwx{padding:14px 15px}
.wwx .c{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.wwx .c .ic{width:12px;height:12px}
.wwx .t{display:flex;align-items:flex-start;justify-content:space-between;margin-top:2px}
.wwx .t b{font:300 40px/1 Barlow;letter-spacing:-.02em}
.wwx .t span{font-size:26px}
.wwx .l{font-size:11.5px;line-height:1.35;margin-top:auto;opacity:.92}
.wwx .l b{font-weight:700}
.wmu{aspect-ratio:auto;height:96px;flex-direction:row;align-items:center;gap:12px;padding:12px}
.wmu .art{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.2) center/cover;flex:none;display:grid;place-items:center}
.wmu .tx{flex:1;min-width:0}
.wmu .tx small{font:600 9.5px var(--mono);letter-spacing:.2em;opacity:.7}
.wmu .tx b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmu .tx span{display:block;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmu .ctl{display:flex;gap:4px}
.wmu .ctl button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.wmu .ctl .pp{background:#fff;color:#111}
.wmu .ctl .ic{width:18px;height:18px}
.wbat{align-items:center;justify-content:center}
.wbat svg{width:70%;height:70%}
.wbat .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wbat .v b{font:800 30px "Barlow Condensed",sans-serif}
.wbat .v small{font:600 9.5px var(--mono);letter-spacing:.16em;opacity:.75}
.wev{padding:15px}
.wev small{font:600 9.5px var(--mono);letter-spacing:.18em;opacity:.75}
.wev b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font:800 20px/1.1 "Barlow Condensed",sans-serif;margin-top:8px}
.wev span{margin-top:auto;font-size:12px;opacity:.9}
.wev .n{font:800 34px/1 "Barlow Condensed",sans-serif;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.page.in .wg,.page.in .ai{animation:popIn .5s var(--sp) both;animation-delay:calc(var(--k,0) * 28ms)}

/* ===== cajón ===== */
#drawer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 10px);transform:translateY(105%);transition:transform .46s var(--eo);will-change:transform}
body.drawerOpen #drawer{transform:none}
#drawer.drag{transition:none}
.dtop{padding:4px 18px 8px;flex:none}
.dsr{position:relative;display:flex;align-items:center;gap:10px}
.dsr input{flex:1;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;padding:0 16px 0 42px;font-size:15.5px;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.dsr input::placeholder{color:rgba(255,255,255,.6)}
#dsI{position:absolute;left:14px;top:13px;width:18px;height:18px;opacity:.7;pointer-events:none}#dsI .ic{width:18px;height:18px}
.dsr .orb{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 10%,color-mix(in srgb,var(--acc2) 70%,#fff) 30%,var(--acc) 75%);box-shadow:0 0 18px var(--acc)}
.dcnt{font:600 10px var(--mono);letter-spacing:.2em;opacity:.6;margin:12px 4px 0;text-transform:uppercase}
.dbody{flex:1;overflow-y:auto;padding:4px 26px calc(var(--sab) + 30px) 16px;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.dbody::-webkit-scrollbar{display:none}
.lt{font:800 18px "Barlow Condensed",sans-serif;margin:16px 0 10px 4px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;content-visibility:auto;contain-intrinsic-size:auto 180px}
.az{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;font:700 10px Barlow;color:rgba(255,255,255,.65);z-index:5;touch-action:none;padding:6px 2px}
.az span{padding:.6px 4px;line-height:1.28}
.azb{position:absolute;right:40px;top:45%;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font:800 32px "Barlow Condensed";opacity:0;transform:scale(.6);transition:.18s;pointer-events:none;z-index:6}
.azb.on{opacity:1;transform:none}
.hidb{display:block;margin:22px auto 0;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.12)}
body.drawerOpen .dg .ai{animation:popIn .45s var(--sp) both}

/* ===== carpeta líquida ===== */
#folder{position:fixed;inset:0;z-index:40;pointer-events:none}
#folder.on{pointer-events:auto}
#folder .fbg{position:absolute;inset:0}
#fblob{position:fixed;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.35);opacity:0}
#fpanel{position:fixed;left:50%;top:50%;width:300px;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;pointer-events:none}
#folder.show #fpanel{opacity:1;pointer-events:auto;transition-delay:.18s}
#fpanel input{display:block;width:100%;background:none;border:0;outline:none;color:#fff;font:800 26px "Barlow Condensed",sans-serif;text-align:center;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
#fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:20px 16px}

/* ===== hojas, menú ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s;z-index:70}
body.sheetOpen #scrim{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + 8px);max-height:84dvh;overflow-y:auto;background:rgba(22,24,30,.92);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);color:#F2F4F8;border-radius:30px;z-index:71;transform:translateY(calc(100% + var(--sab) + 40px));visibility:hidden;transition:transform .42s var(--eo),visibility 0s .42s;padding:10px 18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);scrollbar-width:none}
body.sheetOpen #sheet{transform:none;visibility:visible;transition:transform .42s var(--eo)}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
#sheet h3{font-size:17px;font-weight:700;text-align:center;margin:2px 0 14px;position:relative}
#sheet h3 .x{position:absolute;left:0;top:-4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;opacity:.8}
#sheet h4{font:600 10px var(--mono);letter-spacing:.18em;color:#8F99A9;text-transform:uppercase;margin:18px 4px 8px}
.grp{background:rgba(255,255,255,.06);border-radius:18px;padding:2px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:11.5px;font-weight:500;color:#8F99A9;margin-top:2px}
.row.link{color:color-mix(in srgb,var(--acc) 80%,#fff)}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.25s var(--sp)}
.sw.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}.sw.on::after{left:23px}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:9px;font-weight:700;font-size:12.5px;color:#C9D2DE}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.fld{display:block;margin:8px 0}
.fld span{display:block;font-size:11.5px;font-weight:600;color:#8F99A9;margin-bottom:4px}
.fld input,.fld select{width:100%;border:0;border-radius:12px;background:rgba(255,255,255,.08);padding:11px 12px;font-size:15px;color:#fff;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px}
.btn.alt{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn .ic{width:18px;height:18px}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.walls button{aspect-ratio:9/16;border-radius:12px;background:#222 center/cover;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.walls button.on{box-shadow:0 0 0 2.5px #fff,0 0 16px var(--acc)}
.walls button span{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 5px;font-size:10px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.pal{display:flex;flex-wrap:wrap;gap:12px;padding:6px 2px}
.pal button{width:32px;height:32px;border-radius:50%;background:var(--c)}
.pal button.on{box-shadow:0 0 0 3px #16181e,0 0 0 5px var(--cr),0 0 14px var(--cr)}
.song,.hrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.song .th{width:40px;height:40px;flex:none}.song .th img{width:100%;height:100%;border-radius:10px}
.song .tx{flex:1;min-width:0}.song b{display:block;font-size:14px}.song small{font-size:11px;color:#8F99A9}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.empty{text-align:center;color:#8F99A9;font-size:13px;padding:16px}
#ctx{position:fixed;inset:0;z-index:50;pointer-events:none}
#ctx .cbg{position:absolute;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .25s}
#ctx.on{pointer-events:auto}#ctx.on .cbg{opacity:1}

function glowRun(){const c=glowRun.c||(glowRun.c=document.createElement('canvas'));c.width=c.height=16;const x=c.getContext('2d',{willReadFrequently:true});let n=0;
  while(GQ.length&&n<12){const im=GQ.shift();n++;try{x.clearRect(0,0,16,16);x.drawImage(im,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,w=0;
      for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;if(a<.5)continue;const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);const sat=(mx-mn)/255+.05;r+=d[i]*sat;g+=d[i+1]*sat;b+=d[i+2]*sat;w+=sat}

function refreshNEV(force){if(!(S.calSync&&has('calendarEventsAsync')&&Android.hasCalendar())){NEV=[];return}if(!force&&Date.now()-NEVt<60e3)return;NEVt=Date.now();Android.calendarEventsAsync(120)}
function nextOcc(e,td){if(!e.yearly)return e.date>=td?e.date:null;const y=+td.slice(0,4);let c=y+e.date.slice(4);if(c<td)c=(y+1)+e.date.slice(4);return c<e.date?e.date:c}
function upcoming(){const td=ymd(new Date());return [...S.events,...NEV].map(e=>({e,d:nextOcc(e,td)})).filter(x=>x.d).sort((a,b)=>(a.d+(a.e.start||'')).localeCompare(b.d+(b.e.start||'')))}
function refreshWidgets(){$$('.page').forEach(p=>{const i=+p.dataset.pi;const old=p.querySelectorAll('.wrow');const h=widgetsFor(i);const tmp=document.createElement('div');tmp.innerHTML=h;
    if(old.length===tmp.children.length&&[...old].every((o,k)=>o.innerHTML===tmp.children[k].innerHTML))return;old.forEach(o=>o.remove());p.insertAdjacentHTML('afterbegin',h)});updClockW()}
function refreshLive(){if(NATIVE)nativeDev();pollMedia();refreshNEV();loadWx(false);refreshWidgets()}
$('#pager').addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){e.stopPropagation();hap();cmd(m.dataset.m);return}const w=e.target.closest('[data-w]');if(!w||document.body.classList.contains('editing'))return;hap();
  const k=w.dataset.w;if(k==='clock'){has('openClock')&&Android.openClock()}else if(k==='wx'){S.wxLoc?loadWx(true):geoLocate(false)}else if(k==='bat'){has('openPanel')&&Android.openPanel('battery')}else if(k==='ev'){jvOpen(false,S.lang==='en'?'What do I have this week?':'¿Qué tengo esta semana?')}else if(k==='music'){NP&&NP.pkg?launchPkg(NP.pkg,null):(has('requestMediaAccess')&&!Android.hasMediaAccess()?Android.requestMediaAccess():null)}});
function tick(){const d=new Date();let h=d.getHours();if(!S.h24)h=h%12||12;const e=$('#wct');if(e){e.textContent=pad(h)+':'+pad(d.getMinutes());$('#wcd').textContent=fmt(d,{weekday:'short',day:'numeric',month:'short'})}updClockW()}
function schedTick(){tick();clearTimeout(schedTick._t);schedTick._t=setTimeout(schedTick,60000-Date.now()%60000+60)}

(()=>{const b=$('#srch');let lt=null,long=false;b.addEventListener('pointerdown',()=>{long=false;lt=setTimeout(()=>{long=true;hap('long');jvOpen(true)},450)});
  ['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>clearTimeout(lt)));
  b.addEventListener('click',e=>{if(long)return;if(e.target.closest('.orb'))return;hap();openDrawer(true)})})();

window.onAndroidBack=()=>{if(document.body.classList.contains('sheetOpen'))closeSheet();else if(JV.on)jvClose();else if($('#ctx').classList.contains('on'))closeCtx();else if(OPENF)closeFolder();else if(document.body.classList.contains('feedOpen'))closeFeed();
  else if(document.body.classList.contains('drawerOpen'))closeDrawer();else if(document.body.classList.contains('editing'))endEdit(true);else if((S.page|0)!==0)goPage(0)};
window.onAndroidHome=()=>{if(JV.on){jvClose();return}if(document.body.classList.contains('sheetOpen'))closeSheet();closeCtx();if(OPENF)closeFolder();if(document.body.classList.contains('feedOpen'))closeFeed();
  if(document.body.classList.contains('drawerOpen')){closeDrawer();return}if(document.body.classList.contains('editing')){endEdit(true);return}if((S.page|0)!==0)goPage(0);else animIn()};
window.onAndroidResume=()=>{renderGCard();schedTick();refreshLive();animIn();tiltSetup()};
window.addEventListener('resize',()=>layoutPages(S.page|0));
if(!S.pages||!S.dock)defaultLayout();cleanLayout();
applyTheme();applyWall();renderHome(true);schedTick();
if(NATIVE){nativeDev();setInterval(()=>{if(!document.hidden&&(S.page|0)===1){nativeDev();refreshWidgets()}},30000)}
pollMedia();refreshNEV(true);if(S.wxLoc)loadWx(false);else setTimeout(()=>geoLocate(true),1500);
if(NATIVE&&has('gestureStatus')&&!S.gAsked){try{Android.setGestureConfig(JSON.stringify({mode:'transparent',pill:true}))}catch(e){}}
if(NATIVE&&!S.homeAsked){S.homeAsked=true;save();try{if(!Android.isDefaultLauncher())setTimeout(()=>{const t=T();sheet(`<h3>Aura</h3><p style="font-size:14px;margin-bottom:14px;text-align:center">${esc(t.homeHint)}</p><div style="display:flex;gap:10px"><button class="btn alt" data-x style="flex:1">${esc(t.cancel)}</button><button class="btn" id="hm2" style="flex:1">OK</button></div>`);$('#hm2').onclick=()=>{closeSheet();Android.setDefaultLauncher()}},1500)}catch(e){}}
else if(NATIVE&&!S.gAsked){S.gAsked=true;save();try{const g=gStatus();if(g&&!g.service)setTimeout(gestureSheet,1500)}catch(e){}}
$('#eAdd').innerHTML=ic('plus');$('#eSet').innerHTML=ic('sliders');$('#srchT').textContent=T().search;$('#eCancel').textContent=T().cancel;$('#eDone').textContent=T().done;
