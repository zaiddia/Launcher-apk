<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Launcher CY</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--acc:#FF5B1F;--ink:#111;--dark:#0f0f10;--paper:#f7f4f0;--hh:max(36dvh,280px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--acc);font-family:Jost,"Google Sans",Roboto,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
.ic{width:22px;height:22px;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- HEADER ---------- */
header{position:relative;height:var(--hh);flex:none;background:var(--dark);color:#fff;z-index:3}
.hp{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 24px) 26px 30px;display:flex;flex-direction:column;opacity:0;transform:translateY(-12px);transition:opacity .35s,transform .35s;pointer-events:none}
.hp.on{opacity:1;transform:none;pointer-events:auto}
.greet{display:flex;gap:10px}
.greet .bar{width:3px;background:var(--acc);border-radius:3px;transform:skewX(-14deg)}
.g1{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.g2{font-size:24px;font-weight:800;color:var(--acc);line-height:1;letter-spacing:.02em;text-transform:uppercase}
.prof{display:flex;align-items:center;gap:12px;margin-top:20px;align-self:flex-start}
.ava{width:56px;height:56px;border-radius:50%;border:3px solid var(--acc);background:#262626 center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--acc);flex:none}
.pt b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.pt small{font-size:12px;opacity:.6;display:flex;gap:4px;align-items:center}
.pt small .ic{width:12px;height:12px}
.drow{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;opacity:.92}
.drow .ic{width:16px;height:16px}
.clock{font-size:clamp(58px,19vw,84px);font-weight:800;line-height:.92;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock small{font-size:.28em;margin-left:6px;color:var(--acc);letter-spacing:.05em}
.curl{position:absolute;right:0;bottom:0;width:96px;height:96px;background:linear-gradient(to bottom right,transparent 50%,var(--acc) 50%);pointer-events:none;transition:background .5s}
.flap{position:absolute;inset:0;background:linear-gradient(to bottom right,color-mix(in srgb,var(--acc) 35%,#fff) 0%,color-mix(in srgb,var(--acc) 80%,#000) 50%,transparent 50%);filter:drop-shadow(-6px -6px 7px rgba(0,0,0,.5));border-top-left-radius:26px}
/* calendar header */
.calTop{display:flex;gap:14px;align-items:center;margin-top:20px}
.calTop .ic{width:46px;height:46px;stroke-width:1.6}
.calTop b{display:block;font-size:20px;font-weight:700}
.calTop span{font-size:15px;opacity:.85}
.evH{margin-top:auto}
.evH small{font-size:12px;opacity:.6;letter-spacing:.06em}
.evTitle{font-size:24px;font-weight:800;color:var(--acc);line-height:1.1;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}
.evMeta{font-size:12.5px;opacity:.85;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.evMeta .ic{width:14px;height:14px;margin-right:3px;vertical-align:-2px}
/* music header */
.np{margin-top:18px;max-width:80%}
.npT{font-size:22px;font-weight:800;color:var(--acc);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npT .ic{width:24px;height:24px}
.npL{font-size:13px;opacity:.8;margin-top:6px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npN{margin-top:auto;font-size:13px;max-width:78%}
.npN b{display:block;font-size:15px}
.npN span{opacity:.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* weather header */
.wxNow{display:flex;align-items:center;gap:14px;margin-top:18px}
.wxNow .wi{width:58px;height:58px;stroke-width:1.5;color:var(--acc)}
.wxT{font-size:62px;font-weight:800;line-height:.9}
.wxD b{display:block;font-size:17px;text-transform:capitalize}
.wxD small{opacity:.65;font-size:12.5px}
.wxRow{margin-top:auto;display:flex;gap:18px;font-size:13px;flex-wrap:wrap;max-width:80%}
.wxRow span{display:flex;align-items:center;gap:5px}
.wxRow .ic{width:16px;height:16px;color:var(--acc)}

/* ---------- MAIN ---------- */
main{position:relative;flex:1;min-height:0}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:24px 22px calc(112px + env(safe-area-inset-bottom));opacity:0;transform:translateY(16px);transition:opacity .35s,transform .35s;pointer-events:none;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.pg.on{opacity:1;transform:none;pointer-events:auto}
body.nonav .pg{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.pg[data-p=home]{display:flex;flex-direction:column}
.secT{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.secT b{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.rbtn{width:36px;height:36px;border-radius:12px;background:var(--dark);color:#fff;display:grid;place-items:center}
.rbtn .ic{width:18px;height:18px}
.info{list-style:none;margin-bottom:22px}
.info li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-size:13.5px}
.info li .ic{width:17px;height:17px;opacity:.85}
.info li span{flex:1;font-weight:500}
.info li em{font-style:normal;font-weight:700;text-align:right;max-width:66%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batbar{display:inline-block;width:46px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 20%,transparent);margin-left:8px;vertical-align:1px;overflow:hidden}
.batbar i{display:block;height:100%;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:auto}
.app{aspect-ratio:1;border-radius:16px;background:var(--dark);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .15s}
.app:active{transform:scale(.9)}
.app .ic{width:26px;height:26px}
.hint{font-size:11px;text-align:center;opacity:.6;margin-top:12px}
/* calendar body */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead b{font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.calWrap{position:relative;margin-bottom:18px}
.yearMark{position:absolute;inset:auto 0 0 0;text-align:center;font-size:96px;font-weight:900;opacity:.09;line-height:1;pointer-events:none;bottom:10px}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;position:relative}
.wk div{font-size:11px;font-weight:800;letter-spacing:.06em;opacity:.7;padding:4px 0;text-transform:uppercase}
.days button{height:40px;border-radius:12px;font-size:15px;font-weight:600;position:relative}
.days button.out{opacity:.3}
.days button.today{background:var(--dark);color:var(--acc);font-weight:800}
.days button.sel{outline:2.5px solid var(--dark);outline-offset:-3px}
.days button.has::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.ev{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.82);border-radius:16px;padding:9px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.12);color:#111}
.ev .bd{width:48px;height:48px;border-radius:12px;background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.ev .bd b{font-size:19px}
.ev .bd small{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700;margin-top:2px}
.ev .tx{flex:1;min-width:0}
.ev .tx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tx small{font-size:12px;opacity:.65}
.ev button{opacity:.55;padding:6px}
.ev button .ic{width:18px;height:18px}
.empty{font-size:13px;opacity:.7;text-align:center;padding:14px 8px}
/* music body */
.tt{position:relative;display:flex;justify-content:center;margin:4px 0 14px}
.disc{width:min(60vw,29dvh,250px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#161616 0 2px,#202020 2px 4px);position:relative;box-shadow:0 14px 30px rgba(0,0,0,.35);animation:spin 7s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.cover{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--acc) 50%,#fff),var(--acc) 60%,color-mix(in srgb,var(--acc) 60%,#000)) center/cover;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.hole{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#0f0f10 0 18%,#eee 19% 34%,#222 35% 100%);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.arm{position:absolute;right:calc(50% - min(30vw,14.5dvh,125px) - 26px);top:-6px;width:58px;height:150px;transform-origin:44px 12px;transform:rotate(-22deg);transition:transform .6s}
.playing .arm{transform:rotate(4deg)}
.mrow{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.mrow button .ic{width:20px;height:20px}
.mrow button.act{color:var(--ink)}
.mrow button:not(.act){opacity:.45}
.stars{display:flex;gap:4px}
.stars button .ic{width:20px;height:20px}
.stars button.on .ic{fill:currentColor}
.prog{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pbar{flex:1;height:22px;display:flex;align-items:center}
.pbar div{height:5px;width:100%;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ink)}
.mctl{display:flex;justify-content:center;align-items:center;gap:30px;margin:8px 0 18px}
.mctl .ic{width:26px;height:26px}
.pp{width:64px;height:64px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.pp .ic{width:26px;height:26px}
.song{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;margin-bottom:6px}
.song.cur{background:rgba(255,255,255,.8);color:#111}
.song .th{width:40px;height:40px;border-radius:10px;background:var(--dark) center/cover;flex:none;display:grid;place-items:center;color:var(--acc)}
.song .th .ic{width:18px;height:18px}
.song .tx{flex:1;min-width:0}
.song b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.song button{opacity:.5;padding:6px}
.song button .ic{width:18px;height:18px}
/* weather body */
.hours{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:62px;border-radius:16px;background:var(--dark);color:#fff;padding:10px 4px;text-align:center;font-size:12px}
.hr .wi{width:26px;height:26px;margin:6px auto;display:block;color:var(--acc)}
.hr b{font-size:15px}
.hr small{display:block;opacity:.6;font-size:10.5px;margin-top:2px}
.day{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.82);color:#111;border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.day .wi{width:30px;height:30px;color:#111}
.day .tx{flex:1;min-width:0}
.day .tx b{display:block;font-size:14px;text-transform:capitalize}
.day .tx small{font-size:12px;opacity:.65;text-transform:capitalize}
.day .tp{font-weight:800;font-size:15px;white-space:nowrap}
.day .tp span{opacity:.5;font-weight:600;margin-left:6px}
.wxMsg{text-align:center;padding:26px 10px}
.wxMsg p{font-size:14px;margin-bottom:14px;opacity:.85}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--dark);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:14px}
.btn .ic{width:18px;height:18px}
.btn.alt{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.upd{display:block;text-align:center;font-size:11px;opacity:.55;margin-top:8px}

/* ---------- NAV ---------- */
#nav{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));height:68px;background:var(--dark);border-radius:22px;display:flex;align-items:center;padding:0 8px;gap:4px;z-index:5;transition:transform .4s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#nav button{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.1em;border-radius:16px;transition:transform .3s,background .3s,color .3s;text-transform:uppercase}
#nav button .ic{width:21px;height:21px}
#nav button.on{background:var(--acc);color:var(--ink);transform:translateY(-12px);box-shadow:0 8px 18px rgba(0,0,0,.4)}
body.nonav #nav{transform:translateY(150%)}
.dots{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:7px;z-index:4}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--ink);opacity:.3;transition:.3s}
.dots i.on{opacity:1;width:20px}
body.nonav .dots{display:flex}

/* ---------- SETTINGS ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:15}
body.setOpen #scrim,body.sheetOpen #scrim{opacity:1;pointer-events:auto}
body.sheetOpen #scrim{z-index:24}
#set{position:fixed;top:0;bottom:0;left:0;width:min(84vw,350px);background:var(--paper);color:#111;z-index:20;transform:translateX(-106%);transition:transform .42s cubic-bezier(.2,.8,.2,1);display:flex;border-radius:0 28px 28px 0;box-shadow:12px 0 40px rgba(0,0,0,.4)}
body.setOpen #set{transform:none}
.vlabel{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;letter-spacing:.22em;font-size:13px;padding:26px 12px;text-transform:uppercase;white-space:nowrap}
.setIn{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 30px 4px;scrollbar-width:none}
.setIn::-webkit-scrollbar{display:none}
.sx{float:right;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e9e4de}
.sx .ic{width:18px;height:18px}
.sh3{font-size:11.5px;font-weight:800;letter-spacing:.16em;margin:22px 0 10px;text-transform:uppercase;clear:both}
.sh3 em{font-style:normal;color:var(--acc);filter:brightness(.85)}
.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ring{aspect-ratio:1;border-radius:50%;border:3.5px solid var(--c);transition:.2s}
.ring.on{background:var(--c);transform:scale(1.08)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.row small{display:block;font-size:11.5px;opacity:.55}
.sw{width:50px;height:30px;border-radius:15px;background:#d6d0c9;position:relative;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.25s}
.sw.on{background:var(--dark)}
.sw.on::after{left:23px;background:var(--acc)}
.flags{display:flex;flex-wrap:wrap;gap:9px}
.flag{width:40px;height:40px;border-radius:50%;overflow:hidden;font-size:33px;line-height:40px;text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.2);transition:.2s}
.flag span{display:block;transform:scale(1.45)}
.flag.on{box-shadow:0 0 0 3px var(--dark),0 0 0 6px var(--acc)}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:11.5px;font-weight:700;opacity:.6;margin-bottom:4px}
.fld input,.fld select{width:100%;border:0;border-radius:12px;background:#ebe6e0;padding:11px 12px;font-size:15px;color:#111;outline:none}
.fld input:focus{box-shadow:inset 0 0 0 2px var(--dark)}
.seg{display:flex;background:#ebe6e0;border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:700;font-size:13px}
.seg button.on{background:var(--dark);color:#fff}
.pf{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf .ava{width:60px;height:60px}
.foot{font-size:11px;opacity:.5;margin-top:24px;line-height:1.5}

/* ---------- SHEET ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;background:var(--paper);color:#111;border-radius:28px 28px 0 0;z-index:25;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
body.sheetOpen #sheet{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:#ccc;margin:0 auto 14px}
#sheet h3{font-size:16px;font-weight:800;letter-spacing:.1em;margin-bottom:14px;text-transform:uppercase}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 12px}
.chk input{width:20px;height:20px;accent-color:#111}
.two{display:flex;gap:10px}.two>*{flex:1}
.acts{display:flex;gap:10px;margin-top:10px}.acts .btn{flex:1}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px}
.pick .app{width:52px;height:52px}
.pick .app .ic{width:24px;height:24px}
.res button{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;font-size:14px}
.res button:active{background:#e8e2db}
.res small{opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:spin 1s linear infinite}
.app img{width:64%;height:64%;border-radius:24%;object-fit:cover}
.pick img{width:66%;height:66%;border-radius:24%;object-fit:cover;background:#2a2a2a}
.pick small{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.pick button{min-width:0}
</style>
</head>
<body>
<div id="app">
  <header>
    <section class="hp on" data-p="home">
      <div class="greet"><span class="bar"></span><div><div class="g1" id="g1"></div><div class="g2" id="g2"></div></div></div>
      <button class="prof" id="profBtn"><div class="ava" id="ava"></div><div class="pt"><b id="pname"></b><small id="ploc"></small></div></button>
      <div class="drow" id="hdate"></div>
      <div class="clock" id="clock">00:00</div>
    </section>
    <section class="hp" data-p="cal">
      <div class="greet"><span class="bar"></span><div><div class="g1" data-t="cal1"></div><div class="g2" data-t="cal2"></div></div></div>
      <div class="calTop" id="calTop"></div>
      <div class="evH"><small data-t="first"></small><div class="evTitle" id="evTitle"></div><div class="evMeta" id="evMeta"></div></div>
    </section>
    <section class="hp" data-p="music">
      <div class="greet"><span class="bar"></span><div><div class="g1" data-t="np1"></div><div class="g2" data-t="np2"></div></div></div>
      <div class="np"><div class="npT" id="npT"></div><div class="npL" id="npL"></div></div>
      <div class="npN"><b data-t="next"></b><span id="npN"></span></div>
    </section>
    <section class="hp" data-p="wx">
      <div class="greet"><span class="bar"></span><div><div class="g1" data-t="fc"></div><div class="g2" id="wxCity">—</div></div></div>

/* ============ THEME ============ */
function applyTheme(){
  const c=S.acc;document.documentElement.style.setProperty('--acc',c);
  const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255;
  const L=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);
  const lum=.2126*L(r)+.7152*L(g)+.0722*L(b);
  document.documentElement.style.setProperty('--ink',lum<.18?'#ffffff':'#111111');
  if(NATIVE){try{Android.setNavColor(c)}catch(e){}}
}

const PAGES=['home','cal','music','wx'],NAVI=['home','cal','music','cloud'];

function go(p){
  if(!PAGES.includes(p))p='home';S.page=p;save();
  $$('.hp,.pg').forEach(e=>e.classList.toggle('on',e.dataset.p===p));
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===p));
  $$('#dots i').forEach((d,i)=>d.classList.toggle('on',PAGES[i]===p));
  if(p==='wx')loadWx(false);
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
(()=>{let sx=0,sy=0,st=0;const m=$('#app');
  m.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  m.addEventListener('touchend',e=>{if(document.body.classList.contains('setOpen')||document.body.classList.contains('sheetOpen'))return;

function greetIdx(h){return h>=5&&h<12?0:h>=12&&h<18?1:h>=18&&h<22?2:3}
function tick(){
  const d=new Date(),t=T();
  $('#g1').textContent=t.hello;$('#g2').textContent=t.g[greetIdx(d.getHours())];
  let h=d.getHours(),suf='';if(!S.h24){suf=h<12?'AM':'PM';h=h%12||12}
  $('#clock').innerHTML=pad(h)+':'+pad(d.getMinutes())+(suf?`<small>${suf}</small>`:'');
  $('#hdate').innerHTML=ic('cal')+esc(fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  if(tick._day!==d.getDate()){tick._day=d.getDate();renderCal()}
}

const MODELS={'23090RA98G':'Redmi Note 13 Pro+ 5G','23090RA98I':'Redmi Note 13 Pro+ 5G','23090RA98C':'Redmi Note 13 Pro+','2312DRA50G':'Redmi Note 13 Pro 5G','2312DRA50C':'Redmi Note 13 Pro','23117RA68G':'Redmi Note 13 Pro','23129RAA4G':'Redmi Note 13 5G','23124RA7EO':'Redmi Note 13'};
const CHIPS={'Redmi Note 13 Pro+ 5G':'Dimensity 7200-Ultra','Redmi Note 13 Pro+':'Dimensity 7200-Ultra','Redmi Note 13 Pro 5G':'Snapdragon 7s Gen 2','Redmi Note 13 Pro':'Helio G99-Ultra'};
const DI={model:'',ver:'',bat:null,chg:false};
const SOCS={MT6896:'Dimensity 7200-Ultra',MT6886:'Dimensity 7200',SM7435:'Snapdragon 7s Gen 2',MT6789:'Helio G99',MT6897:'Dimensity 8300',SM7550:'Snapdragon 7 Gen 3',MT6878:'Dimensity 7300'};
const gb=b=>(b/1073741824).toFixed(b>=1e11?0:1)+' GB';
function nativeRefresh(){try{DI.n=JSON.parse(Android.deviceInfo());const b=JSON.parse(Android.battery());DI.bat=b.level;DI.chg=b.charging}catch(e){}renderInfo()}
async function readDevice(){
  if(NATIVE){nativeRefresh();setInterval(()=>{if(!document.hidden&&S.page==='home')nativeRefresh()},10000);return}
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){const h=await navigator.userAgentData.getHighEntropyValues(['model','platformVersion']);DI.model=h.model||'';DI.ver=h.platformVersion||''}}catch(e){}
  const ua=navigator.userAgent;
  if(!DI.ver){const m=ua.match(/Android\s([\d.]+)/);if(m)DI.ver=m[1]}
  if(!DI.model){const m=ua.match(/Android [\d.]+;\s*([^;)]+?)(?:\sBuild|\)|;)/);if(m&&m[1]!=='K')DI.model=m[1]}
  try{const b=await navigator.getBattery();const up=()=>{DI.bat=Math.round(b.level*100);DI.chg=b.charging;renderInfo()};up();b.addEventListener('levelchange',up);b.addEventListener('chargingchange',up)}catch(e){}
  renderInfo();
}
function renderInfo(){
  const t=T(),code=DI.model;let nice=MODELS[code]||code||t.unknown;
  let ver=DI.ver?'Android '+DI.ver.split('.')[0]:'—';
  const chip=CHIPS[nice];const cores=navigator.hardwareConcurrency;
  let cpu=chip?`${chip} · ${cores||8} cores`:(cores?cores+' cores':'—');
  let ram=S.ram||(navigator.deviceMemory?(navigator.deviceMemory>=8?'8 GB+':navigator.deviceMemory+' GB'):'—');
  let sto=S.sto||'—';
  let scr=Math.round(screen.width*devicePixelRatio)+' × '+Math.round(screen.height*devicePixelRatio);
  if(NATIVE&&DI.n){const n=DI.n;nice=MODELS[n.code]||n.model||n.code;ver='Android '+n.android+(n.os?' · '+n.os:'');
    cpu=(SOCS[n.soc]||n.soc||'—')+' · '+n.cores+' cores';ram=gb(n.ramTotal-n.ramAvail)+' / '+gb(n.ramTotal);sto=gb(n.stoTotal-n.stoFree)+' / '+gb(n.stoTotal);scr=n.w+' × '+n.h}
  const bat=DI.bat==null?'—':`${DI.chg?'⚡ ':''}${DI.bat}%<span class="batbar"><i style="width:${DI.bat}%"></i></span>`;
  const rows=[['dev',t.model,esc(nice)],['droid',t.android,esc(ver)],['cpu',t.cpu,esc(cpu)],['ram',t.ram,esc(ram)],['sto',t.sto,esc(sto)],['screen',t.scr,scr],['bat',t.bat,bat]];

const DB={db:null,

async function readTags(file){

      if(id==='TIT2')out.title=txt();else if(id==='TPE1')out.artist=txt();else if(id==='TALB')out.album=txt();
      else if(id==='APIC'&&!out.cover){const enc=d[0];let i=1;while(i<d.length&&d[i])i++;let mime=dec(d.subarray(1,i),0)||'image/jpeg';i+=2;
        if(enc===1||enc===2){while(i<d.length-1&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}

  $('#prev').innerHTML=ic('prev');$('#next').innerHTML=ic('next');$('#addSong').innerHTML=ic('plus');
  if(!s){$('#tCur').textContent='0:00';$('#tDur').textContent='0:00';$('#pfill').style.width='0'}
  $('#plist').innerHTML=songs.length?songs.map((x,i)=>{const c=coverUrl(x);return `<div class="song ${i===cur?'cur':''}" data-i="${i}"><div class="th" ${c?`style="background-image:url(${c})"`:''}>${c?'':ic('music')}</div><div class="tx"><b>${esc(x.title)}</b><small>${esc(x.artist||t.unknown)}</small></div><button data-del="${x.id}" aria-label="del">${ic('trash')}</button></div>`}).join(''):`<p class="empty">${esc(t.nosong)}</p>`;
  renderPlayState();
}
function mediaMeta(){
  if(!('mediaSession'in navigator))return;const s=songs[cur];if(!s)return;
  const art=coverUrl(s);
  navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'',album:s.album||'',artwork:art?[{src:art,sizes:'512x512',type:s.cover.type||'image/jpeg'}]:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  const H={play:()=>au.play(),pause:()=>au.pause(),previoustrack:()=>skip(-1),nexttrack:()=>skip(1),seekto:d=>{au.currentTime=d.seekTime}};
  for(const k in H){try{navigator.mediaSession.setActionHandler(k,H[k])}catch(e){}}
}
async function loadSongs(){
  try{await DB.open();songs=(await DB.all()).sort((a,b)=>a.added-b.added)}catch(e){songs=[]}
  cur=songs.length?Math.min(Math.max(0,S.lastSong|0),songs.length-1):-1;
  if(cur>=0)setSrc(false);else renderMusic();
}

/* ============ WEATHER ============ */
const wcat=c=>c===0?0:c<=2?1:c===3?2:c<=48?3:c<=57?4:c<=67?5:c<=77?6:c<=82?7:c<=86?6:8;
const wicon=(c,day)=>{const k=wcat(c);return ['sun','partly','cloud','fog','drizzle','rain','snow','rain','storm'][k].replace('sun',day?'sun':'moon').replace('partly',day?'partly':'partlyN')};
const wsvg=(c,day,cls='wi')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[wicon(c,day)]}</svg>`;
let wxBusy=false;
async function loadWx(force){
  if(!S.wxLoc){renderWx();if(!loadWx._asked){loadWx._asked=true;locate(true)}return}
  if(!force&&S.wx&&S.wx.unit===S.unit&&Date.now()-S.wx.t<15*60e3){renderWx();return}
  if(wxBusy)return;wxBusy=true;renderWx(true);
  try{
    const {lat,lon}=S.wxLoc;
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7${S.unit==='F'?'&temperature_unit=fahrenheit&wind_speed_unit=mph':''}`;
    const r=await fetch(u);if(!r.ok)throw 0;S.wx={t:Date.now(),unit:S.unit,d:await r.json()};save();
  }catch(e){if(!S.wx)toast(T().wxErr)}
  wxBusy=false;renderWx();
}
function locate(silent){
  if(!navigator.geolocation){if(!silent)citySheet();return}
  toast('📍 …');
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=+p.coords.latitude.toFixed(3),lon=+p.coords.longitude.toFixed(3);let name='';
    try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${S.lang}`);const j=await r.json();name=j.city||j.locality||j.principalSubdivision||''}catch(e){}
    S.wxLoc={lat,lon,name:name||`${lat}, ${lon}`};S.wx=null;save();renderProfile();loadWx(true);
  },()=>{if(!silent)citySheet();else renderWx()},{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
}
function citySheet(){
  const t=T();
  sheet(`<h3>${esc(t.locn)}</h3><button class="btn" id="geoB" style="width:100%;margin-bottom:14px">${ic('locate')} ${esc(t.locate)}</button>
  <label class="fld"><input id="cq" placeholder="${esc(t.city)}" autocomplete="off"></label><div class="res" id="cres"></div>`);
  $('#geoB').onclick=()=>{closeSheet();locate(false)};
  let tm;$('#cq').oninput=e=>{clearTimeout(tm);const q=e.target.value.trim();if(q.length<2){$('#cres').innerHTML='';return}
    tm=setTimeout(async()=>{try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${S.lang}`);const j=await r.json();
      $('#cres').innerHTML=(j.results||[]).map(c=>`<button data-c='${esc(JSON.stringify({lat:c.latitude,lon:c.longitude,name:c.name}))}'>${esc(c.name)} <small>${esc([c.admin1,c.country].filter(Boolean).join(', '))}</small></button>`).join('')||'<p class="empty">—</p>'}catch(x){$('#cres').innerHTML=`<p class="empty">${esc(t.wxErr)}</p>`}},350)};
  $('#cres').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;S.wxLoc=JSON.parse(b.dataset.c);S.wx=null;save();closeSheet();renderProfile();loadWx(true)};
  setTimeout(()=>$('#cq').focus(),350);
}
function renderWx(loading){
  const t=T(),body=$('#wxBody');const deg=S.unit==='F'?'°F':'°';
  $('#wxCity').textContent=S.wxLoc?S.wxLoc.name:'—';
  if(!S.wxLoc){body.innerHTML=`<div class="wxMsg"><p>${esc(t.wxNeed)}</p><button class="btn" id="wl">${ic('locate')} ${esc(t.locate)}</button><br><br><button class="btn alt" id="wc">${ic('search')} ${esc(t.city)}</button></div>`;
    $('#wl').onclick=()=>locate(false);$('#wc').onclick=citySheet;$('#wxT').textContent='--°';$('#wxD').textContent='';$('#wxF').textContent='';$('#wxRow').innerHTML='';$('#wxIco').innerHTML=wsvg(1,1);return}
  const d=S.wx&&S.wx.d;
  if(!d){body.innerHTML=`<div class="wxMsg"><p>${loading?'…':esc(t.wxErr)}</p>${loading?ic('refresh','spin'):`<button class="btn" id="wr">${ic('refresh')}</button>`}</div>`;if(!loading)$('#wr').onclick=()=>loadWx(true);return}
  const c=d.current;
  $('#wxIco').innerHTML=wsvg(c.weather_code,c.is_day);
  $('#wxT').textContent=Math.round(c.temperature_2m)+'°';
  $('#wxD').textContent=t.wx[wcat(c.weather_code)];
  $('#wxF').textContent=`${t.feels} ${Math.round(c.apparent_temperature)}${deg}`;
  const wu=S.unit==='F'?'mph':'km/h';
  $('#wxRow').innerHTML=`<span>${ic('drop')}${c.relative_humidity_2m}%</span><span>${ic('wind')}${Math.round(c.wind_speed_10m)} ${wu}</span><span>${ic('umb')}${d.daily.precipitation_probability_max[0]??0}%</span>`;
  const H=d.hourly,key=c.time.slice(0,13);let i0=H.time.findIndex(x=>x.slice(0,13)===key);if(i0<0)i0=0;
  let hrs='';for(let i=i0;i<Math.min(i0+24,H.time.length);i++){hrs+=`<div class="hr"><small>${i===i0?'●':H.time[i].slice(11,16)}</small>${wsvg(H.weather_code[i],H.is_day[i])}<b>${Math.round(H.temperature_2m[i])}°</b><small>${ic('drop').replace('class="ic ','style="width:10px;height:10px;vertical-align:-1px" class="ic ')}${H.precipitation_probability[i]??0}%</small></div>`}
  const D=d.daily;
  const days=D.time.map((ds,i)=>`<div class="day">${wsvg(D.weather_code[i],1)}<div class="tx"><b>${esc(i===0?t.today:fmt(parseD(ds),{weekday:'long'}))}</b><small>${esc(t.wx[wcat(D.weather_code[i])])} · ${D.precipitation_probability_max[i]??0}% ${esc(t.rain.toLowerCase())}</small></div><div class="tp">${Math.round(D.temperature_2m_max[i])}°<span>${Math.round(D.temperature_2m_min[i])}°</span></div></div>`).join('');
  body.innerHTML=`<div class="secT"><b>${esc(t.hourly)}</b><button class="rbtn" id="wr" aria-label="refresh">${ic('refresh',loading?'spin':'')}</button></div><div class="hours">${hrs}</div>
  <div class="secT"><b>${esc(t.week)}</b><button class="rbtn" id="wp" aria-label="location">${ic('pin')}</button></div>${days}
  <small class="upd">${esc(t.updated)} ${new Date(S.wx.t).toLocaleTimeString(t.loc,{hour:'2-digit',minute:'2-digit'})} · Open-Meteo</small>`;
  $('#wr').onclick=()=>loadWx(true);$('#wp').onclick=citySheet;
}

/* ============ SETTINGS ============ */
function openSet(){renderSet();document.body.classList.add('setOpen')}
function closeSet(){document.body.classList.remove('setOpen')}
function renderSet(){
  const t=T();
  const ini=(S.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  $('#setIn').innerHTML=`<button class="sx" id="sx">${ic('close')}</button>
  <div class="sh3" style="clear:none;margin-top:8px">${esc(t.accent)}</div>
  <div class="rings">${COLORS.map(c=>`<button class="ring ${c===S.acc?'on':''}" style="--c:${c}" data-c="${c}"></button>`).join('')}</div>
  <div class="sh3">${esc(t.navbar)} <em>${S.nav?'ON':'OFF'}</em></div>
  <div class="row"><small style="font-size:12px;opacity:.6;max-width:200px">${esc(t.navHint)}</small><button class="sw ${S.nav?'on':''}" id="swNav"></button></div>
  <div class="sh3">${esc(t.lang)} <em>${esc(t.lname)}</em></div>
  <div class="flags">${Object.keys(LANGS).map(k=>`<button class="flag ${k===S.lang?'on':''}" data-l="${k}" aria-label="${LANGS[k].lname}"><span>${LANGS[k].flag}</span></button>`).join('')}</div>
  <div class="sh3">${esc(t.profile)}</div>
  <div class="pf"><div class="ava" ${S.photo?`style="background-image:url(${S.photo})"`:''}>${S.photo?'':esc(ini)}</div><button class="btn alt" id="phB" style="padding:9px 12px;font-size:13px">${esc(t.photo)}</button></div>
  <label class="fld"><span>${esc(t.name)}</span><input id="sName" value="${esc(S.name)}" maxlength="30"></label>
  <label class="fld"><span>${esc(t.locn)}</span><input id="sLoc" value="${esc(S.loc)}" placeholder="${esc(S.wxLoc?S.wxLoc.name:'')}" maxlength="40"></label>
  <div class="row"><span>${esc(t.h24)}</span><button class="sw ${S.h24?'on':''}" id="sw24"></button></div>
  <div class="row"><span>${esc(t.unit)}</span><div class="seg" style="width:120px"><button data-u="C" class="${S.unit==='C'?'on':''}">°C</button><button data-u="F" class="${S.unit==='F'?'on':''}">°F</button></div></div>
  <div class="sh3">${esc(t.device)}</div>
  ${NATIVE?`<button class="btn" id="hmB" style="width:100%">${ic('home')} ${esc(t.setHome)}</button>`:`<div class="two"><label class="fld"><span>RAM</span><input id="sRam" value="${esc(S.ram)}" placeholder="${esc(t.ramH)}"></label><label class="fld"><span>${esc(t.sto)}</span><input id="sSto" value="${esc(S.sto)}" placeholder="${esc(t.stoH)}"></label></div>`}
  <button class="btn alt" id="fsB" style="width:100%;margin-top:6px">${ic('full')} ${esc(t.fullscreen)}</button>
  <button class="btn alt" id="rsB" style="width:100%;margin-top:10px;color:#c00">${esc(t.reset)}</button>
  <p class="foot">Launcher CY · v1.1 · ${NATIVE?'APK':'Web'}<br>Clima: Open-Meteo · Ubicación: BigDataCloud</p>`;
  $('#sx').onclick=closeSet;
  $('#setIn .rings').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;S.acc=b.dataset.c;save();applyTheme();$$('#setIn .ring').forEach(r=>r.classList.toggle('on',r===b))};
  $('#swNav').onclick=()=>{S.nav=!S.nav;save();document.body.classList.toggle('nonav',!S.nav);renderSet()};
  $('#setIn .flags').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;S.lang=b.dataset.l;save();applyLang();renderSet()};
  $('#phB').onclick=()=>$('#photoIn').click();
  const bind=(id,k,fn)=>$(id)&&$(id).addEventListener('input',e=>{S[k]=e.target.value;save();fn&&fn()});
  bind('#sName','name',renderProfile);bind('#sLoc','loc',renderProfile);bind('#sRam','ram',renderInfo);bind('#sSto','sto',renderInfo);
  $('#sw24').onclick=()=>{S.h24=!S.h24;save();tick();renderSet()};
  $$('#setIn [data-u]').forEach(b=>b.onclick=()=>{S.unit=b.dataset.u;save();renderSet();if(S.wxLoc)loadWx(true)});
  if($('#hmB'))$('#hmB').onclick=()=>Android.setDefaultLauncher();
  $('#fsB').onclick=()=>{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen({navigationUI:'hide'})).catch(()=>{})};
  $('#rsB').onclick=async e=>{const b=e.currentTarget;if(!b._armed){b._armed=true;toast(T().sure);setTimeout(()=>b._armed=false,2500);return}
    try{localStorage.removeItem(KEY);indexedDB.deleteDatabase('cyMusic')}catch(x){}location.reload()};
}
$('#photoIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const img=new Image();img.onload=()=>{
  const c=document.createElement('canvas'),s=256,m=Math.min(img.width,img.height);c.width=c.height=s;
  c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);S.photo=c.toDataURL('image/jpeg',.85);save();renderProfile();renderSet();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};
$('#gear').innerHTML=ic('gear');$('#gear').onclick=openSet;$('#profBtn').onclick=openSet;
$('#mPrev').innerHTML=ic('left');$('#mNext').innerHTML=ic('right');$('#addEv').innerHTML=ic('plus');

/* ============ SHEET ============ */
function sheet(html){$('#sheetIn').innerHTML=html;document.body.classList.add('sheetOpen')}
function closeSheet(){document.body.classList.remove('sheetOpen');document.activeElement&&document.activeElement.blur()}
$('#sheet').addEventListener('click',e=>{if(e.target.closest('[data-x]'))closeSheet()});
$('#scrim').onclick=()=>{if(document.body.classList.contains('sheetOpen'))closeSheet();else closeSet()};
window.addEventListener('popstate',()=>{closeSheet();closeSet()});

/* ============ LANG ============ */
function applyLang(){
  const t=T();document.documentElement.lang=S.lang;
  $$('[data-t]').forEach(e=>{if(t[e.dataset.t]!=null)e.textContent=t[e.dataset.t]});
  renderNav();go(S.page);tick();renderInfo();renderCal();renderMusic();renderWx();renderProfile();
}

/* ============ BOOT ============ */
applyTheme();document.body.classList.toggle('nonav',!S.nav);
applyLang();renderGrid();readDevice();loadSongs();
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.page==='wx')loadWx(false)}});
if(S.wxLoc)setTimeout(()=>loadWx(false),800);
window.onAndroidBack=()=>{if(document.body.classList.contains('sheetOpen'))closeSheet();else if(document.body.classList.contains('setOpen'))closeSet();else if(S.page!=='home')go('home')};
window.onAndroidHome=()=>{closeSheet();closeSet();go('home');$$('.pg').forEach(p=>p.scrollTop=0)};
window.onAndroidResume=()=>{INST=null;tick();if(NATIVE)nativeRefresh();if(S.page==='wx')loadWx(false)};
if(NATIVE&&!S.homeAsked){S.homeAsked=true;save();try{if(!Android.isDefaultLauncher())setTimeout(()=>{const t=T();sheet(`<h3>${esc(t.setHome)}</h3><p style="font-size:14px;margin-bottom:16px">${esc(t.setHomeHint)}</p><div class="acts"><button class="btn alt" data-x>${esc(t.cancel)}</button><button class="btn" id="hm2">${ic('home')} OK</button></div>`);$('#hm2').onclick=()=>{closeSheet();Android.setDefaultLauncher()}},1200)}catch(e){}}
if(!NATIVE&&'serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
