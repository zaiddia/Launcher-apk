name: Compilar APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleKustomRelease assembleIos27Release --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/kustom/release/app-kustom-release.apk out/Launcher-CY.apk
          cp android/app/build/outputs/apk/ios27/release/app-ios27-release.apk out/Launcher-27.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-apks
          path: out/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Launchers v1.3.${{ github.run_number }} (con gestos)
          make_latest: true
          files: |
            out/Launcher-CY.apk
            out/Launcher-27.apk
          body: |
            - **Launcher-27.apk**: tema estilo iOS 27 (reloj gigante, mapa, música con letras, calendario).
            - **Launcher-CY.apk**: tema estilo KLWP (cabecera negra con esquina doblada).

            Instala el que quieras (o los dos). Luego: Ajustes → Apps → Apps predeterminadas → App de inicio.
