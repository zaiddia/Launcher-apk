plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.cy.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cy.launcher'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.4.${runNumber}"
    }

    // Llave de firma fija para que cada APK nuevo se instale como actualización.
    // Es solo para uso personal; no la uses para publicar en Play Store.
    signingConfigs {
        cy {
            storeFile file('launcher-cy.keystore')
            storePassword 'launchercy'
            keyAlias 'launchercy'
            keyPassword 'launchercy'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.cy
        }
        debug {
            signingConfig signingConfigs.cy
        }
    }

    // Dos temas = dos apps independientes (se pueden instalar las dos a la vez)
    flavorDimensions 'theme'
    productFlavors {
        kustom {
            dimension 'theme'
            resValue 'string', 'app_name', 'Launcher CY'
        }
        ios27 {
            dimension 'theme'
            applicationId 'com.cy.launcher27'
            resValue 'string', 'app_name', 'Launcher 27'
        }
    }

    // La interfaz de cada tema se toma de su carpeta del repositorio.
    sourceSets {
        kustom { assets.srcDirs = ['../../web'] }
        ios27 { assets.srcDirs = ['../../web27'] }
    }

    buildFeatures {
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
