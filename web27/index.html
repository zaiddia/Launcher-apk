<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1E2421">
<meta name="mobile-web-app-capable" content="yes">
<title>Launcher 27</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'Anton';font-weight:400;font-display:swap;src:url(fonts/anton-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
:root{--acc:#1E2421;--on:#fff;--bg:#ebe8ed;--tile:#f3f1f5;--ink:#141414;--mut:#6d6a72;--topH:max(34dvh,270px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--acc);font-family:Barlow,Roboto,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
.ic{width:22px;height:22px;flex:none}
.cond{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif,Barlow,sans-serif}

/* ---------- TOP ---------- */
#top{position:fixed;left:0;right:0;top:0;height:var(--topH);background:var(--acc);color:var(--on);overflow:hidden;transition:background .5s}
.tl{position:absolute;inset:0;padding-top:env(safe-area-inset-top);opacity:0;transform:scale(.96);transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.25,1),visibility 0s .5s;pointer-events:none;visibility:hidden}
.tl.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
/* clock */
#clk{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 2px);bottom:22px;display:flex;align-items:center;justify-content:center;font-family:Anton,"Bebas Neue",Impact,"Arial Narrow",sans-serif-condensed,sans-serif;font-size:min(46vw,calc(var(--topH) * .78));line-height:1;letter-spacing:-.01em;color:#f2eff4}
#clk span{display:block}
#mm{color:transparent;-webkit-text-stroke:max(2px,.012em) #f2eff4;margin-left:.04em}
#ampm{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 12px);font:700 13px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.2em;opacity:.8}
/* map */
.mapLbl{position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 12px);font:600 14px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.06em;opacity:.95}
.map{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 38px);width:100%;height:calc(100% - env(safe-area-inset-top) - 104px)}
.map path{fill:#ebe8ed}
.map .cross{stroke:#fff;stroke-width:.25;opacity:.6}
.map .pt{fill:#ffd23f;stroke:var(--acc);stroke-width:.6}
.map .pulse{fill:none;stroke:#ffd23f;stroke-width:.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.coord{position:absolute;left:24px;right:24px;bottom:40px;height:26px;border-radius:4px;background:#ebe8ed;color:#141414;font:700 12.5px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:8px}
/* music top */
.blur{position:absolute;left:50%;top:50%;width:36px;height:36px;background:var(--acc) center/cover;transform:translate(-50%,-50%) scale(14);filter:blur(1.5px) brightness(.5) saturate(1.3)}
.vinylWrap{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 50%);transform:translate(-50%,-58%)}
.vinyl{width:min(58vw,calc(var(--topH) * .74));aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c0c 0 1.6px,#1b1b1b 1.6px 3.2px);box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06);position:relative;animation:spin 6s linear infinite;animation-play-state:paused}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.vlabel{position:absolute;inset:29%;border-radius:50%;background:#e9e6ec center/cover;display:grid;place-items:center;color:#141414}
.vhole{position:absolute;left:50%;top:50%;width:5%;height:5%;transform:translate(-50%,-50%);border-radius:50%;background:#000;z-index:2}
.lp{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 10px);border:1.5px solid rgba(255,255,255,.8);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font:700 10px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif}
.lyr{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 50%);transform:translateY(-62%);text-align:center;pointer-events:none;z-index:3}
.lyr b{display:block;font:800 clamp(20px,6.4vw,28px)/1.08 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;color:#ffc93c;text-shadow:0 2px 10px rgba(0,0,0,.8);transition:opacity .3s}
.lyr small{display:block;margin-top:6px;font:600 13px Barlow;color:#fff;opacity:.85;text-shadow:0 1px 6px #000}
/* calendar top */
.mc{position:absolute;inset:calc(env(safe-area-inset-top) + 10px) 16px 34px;display:flex;flex-direction:column}
.mch{display:flex;align-items:flex-end;justify-content:space-between}
.mch b{font:400 clamp(40px,13vw,58px)/.9 Anton,Impact,sans-serif-condensed,sans-serif;color:transparent;-webkit-text-stroke:1.5px #f2eff4;letter-spacing:.02em}
.mch span{font:700 15px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.2em;opacity:.8}
.mch .nav{display:flex;gap:6px}
.mch .nav button{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center}
.mch .nav .ic{width:16px;height:16px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;margin-top:6px;font:600 13.5px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;text-align:center;align-items:center}
.mgrid .wd{opacity:.6;font-size:11px;letter-spacing:.08em}
.mgrid .o{opacity:.3}
.mgrid .t span{background:#f2eff4;color:var(--acc);border-radius:7px;padding:1px 6px}
.mgrid .e span{border-bottom:2px solid #ffc93c}

/* ---------- CARD ---------- */
#card{position:fixed;left:0;right:0;bottom:0;top:calc(var(--topH) - 24px);background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.25);overflow:hidden}
.hello{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.hello>div{flex:1;min-width:0}
.hello h1{font:800 18px/1.05 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello p{font:500 17px/1.2 Barlow;margin-top:2px}
.hello small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden}
.hello small .ic{width:12px;height:12px}
.ava{width:56px;height:56px;border-radius:50%;flex:none;background:#333 center/cover;box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--acc);display:grid;place-items:center;color:#fff;font:800 19px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif}
.ask{margin:0 16px;position:relative}
.ask input{width:100%;height:38px;border:0;border-radius:20px;background:var(--acc);color:var(--on);padding:0 46px 0 18px;font:700 13px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.32em;text-align:center;outline:none;transition:background .5s}
.ask input::placeholder{color:var(--on);opacity:.95}
.ask input:focus{text-align:left;letter-spacing:.06em;font-size:15px}
.ask>button{position:absolute;right:5px;top:5px;width:28px;height:28px;border-radius:50%;background:var(--on);color:var(--acc);display:grid;place-items:center}
.ask>button .ic{width:15px;height:15px;stroke-width:2.6}
#res{position:absolute;left:0;right:0;top:44px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;max-height:46dvh;overflow:auto;display:none}
#res.on{display:block}
#res button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;font-size:14.5px;border-bottom:1px solid #eee}
#res img,#res .ri{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:#f0eef2}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 16px 8px;position:relative}
.tind{position:absolute;left:16px;top:14px;height:64px;width:calc((100% - 68px) / 4);border-radius:16px;box-shadow:inset 0 0 0 2.5px var(--ink);transform:translateX(calc(var(--i,0) * (100% + 12px)));transition:transform .5s cubic-bezier(.3,1.35,.45,1);pointer-events:none;z-index:2}
.tab{height:64px;border-radius:16px;background:var(--tile);box-shadow:4px 4px 10px rgba(0,0,0,.12),-3px -3px 8px rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:800 10px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.1em;text-transform:uppercase;transition:.2s}
.tab .ic{width:23px;height:23px;stroke-width:2.2}
.tab{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tab.on .ic{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.tab:active{transform:scale(.92)}
.body{position:relative;flex:1;min-height:0;overflow:hidden}
.track{display:flex;height:100%;width:400%;transform:translateX(calc(var(--i,0) * -25%));transition:transform .48s cubic-bezier(.22,.9,.24,1);will-change:transform}
.track.drag{transition:none}
.pg{position:relative;flex:0 0 25%;width:25%;height:100%;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(24px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior:contain}
.pg::-webkit-scrollbar{display:none}
.sec{display:flex;align-items:center;gap:10px;margin:8px 0 10px;font:700 11px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.sec::after{content:"";flex:1;height:1px;background:#cfcad3}
.sec .sb{order:3;width:28px;height:28px;border-radius:9px;background:var(--tile);box-shadow:2px 2px 6px rgba(0,0,0,.12);display:grid;place-items:center;color:var(--ink)}
.sec .sb .ic{width:15px;height:15px}
/* home */
.dev{display:flex;gap:12px}
.dl{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.di{display:flex;gap:9px;align-items:center}
.di .ic{width:20px;height:20px;stroke-width:1.8}
.di>div{min-width:0}
.di b{display:block;font:800 13px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.di small{display:block;font-size:11.5px;line-height:1.25;color:var(--mut)}
.di.big .ic{width:28px;height:28px}
.di.big b{font-size:19px;line-height:1}
.dr{flex:none;max-width:46%;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.dots{display:grid;grid-template-columns:repeat(4,22px);gap:9px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.dot.on{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--c)}
.batt{display:flex;gap:10px;align-items:flex-end}
.bico{width:40px;height:68px;border:3px solid var(--ink);border-radius:7px;padding:3px;display:flex;flex-direction:column-reverse;gap:3px;position:relative}
.bico::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:5px;margin-left:-8px;background:var(--ink);border-radius:2px 2px 0 0}
.bico i{flex:1;border-radius:2px;background:var(--ink);opacity:.12}
.bico i.f{opacity:1}
.bico.low i.f{background:#e2323b}
.bico.chg::after{content:"⚡";position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#ffc93c;text-shadow:0 0 3px #000}
.btx{min-width:0;font:600 10.5px/1.45 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left}
.btx b{color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
/* apps */
.agrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.ap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.ap .t{width:100%;aspect-ratio:1;max-width:56px;border-radius:15px;background:var(--tile);box-shadow:3px 3px 8px rgba(0,0,0,.13),-2px -2px 6px rgba(255,255,255,.95);display:grid;place-items:center;transition:transform .15s}
.ap:active .t{transform:scale(.9)}
.ap .t .ic{width:25px;height:25px;stroke-width:1.9}
.ap .t img{width:70%;height:70%;border-radius:24%;object-fit:cover}
.ap small{font:700 9px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.06em;text-transform:uppercase;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
.hazard{height:30px;margin:20px -16px 0;background:repeating-linear-gradient(-45deg,var(--ink) 0 14px,transparent 14px 28px);opacity:.92}
.hint{font-size:11px;color:var(--mut);text-align:center;margin-top:10px}
/* music */
.msrc{display:flex;justify-content:center;margin:2px 0 6px}
.msrc img,.msrc .ic{width:24px;height:24px;border-radius:50%}
.mt{text-align:center;font:800 20px/1.1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma{text-align:center;font:600 13px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl{display:flex;justify-content:space-between;align-items:center;margin:16px 6px 10px}
.mctl button .ic{width:22px;height:22px}
.mctl .pp{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.mctl .pp .ic{width:22px;height:22px}
.prog{display:flex;align-items:center;gap:10px;font:600 11.5px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;color:var(--mut);font-variant-numeric:tabular-nums}
.pbar{flex:1;height:22px;display:flex;align-items:center}
.pbar div{width:100%;height:4px;border-radius:2px;background:#d3ced7;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ink)}
.cardx{background:var(--tile);border-radius:16px;padding:14px;box-shadow:3px 3px 10px rgba(0,0,0,.1);margin:14px 0;font-size:13px;line-height:1.4}
.cardx b{display:block;font:800 14px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font:700 14px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.btn .ic{width:17px;height:17px}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.song{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.song.cur{background:var(--tile);box-shadow:2px 2px 8px rgba(0,0,0,.1)}
.song .th{width:40px;height:40px;border-radius:9px;background:#d9d5dd center/cover;flex:none;display:grid;place-items:center}
.song .th .ic{width:18px;height:18px}
.song .tx{flex:1;min-width:0}
.song b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .del{opacity:.45;padding:6px}
.song .del .ic{width:17px;height:17px}
/* calendar */
.ev{margin-bottom:14px}
.ev .bar{background:var(--ink);color:#fff;font:700 15px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.03em;padding:7px 12px;border-radius:3px;display:flex;align-items:center;gap:8px}
.ev .bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .bar .ic{width:15px;height:15px;opacity:.7}
.ev .meta{display:flex;gap:14px;align-items:center;font:600 12px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.04em;color:var(--mut);padding:5px 4px 0;flex-wrap:wrap}
.ev .meta span{display:flex;align-items:center;gap:4px}
.ev .meta .ic{width:13px;height:13px}
.ev .meta .left{margin-left:auto;color:var(--ink);font-weight:800}
.ev .meta .left.now{color:#e2323b}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:16px}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s;z-index:40}
body.sheetOpen #scrim{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:41;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
body.sheetOpen #sheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#c8c3cc;margin:0 auto 14px}
#sheet h3{font:800 17px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 12px}
#sheet h4{font:700 11px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin:18px 0 8px}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld input{width:100%;border:0;border-radius:12px;background:#fff;padding:11px 12px;font-size:15px;color:#111;outline:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14.5px}
.sw{width:48px;height:28px;border-radius:14px;background:#cfcad3;position:relative;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.25s}
.sw.on{background:var(--ink)}.sw.on::after{left:23px}
.seg{display:flex;background:#fff;border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.flags{display:flex;gap:10px}
.flag{width:40px;height:40px;border-radius:50%;overflow:hidden;font-size:33px;line-height:40px;text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.2)}
.flag span{display:block;transform:scale(1.45)}
.flag.on{box-shadow:0 0 0 3px var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 10px}
.chk input{width:20px;height:20px;accent-color:#111}
.two{display:flex;gap:10px}.two>*{flex:1}
.acts{display:flex;gap:10px;margin-top:8px}.acts .btn{flex:1}
.res2 button{display:block;width:100%;text-align:left;padding:11px;border-radius:10px;font-size:14px}
.res2 small{color:var(--mut)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.ap .t{transition:transform .22s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.ap.prs .t,.ap:active .t{transform:scale(.86)}
.ap.lch .t{animation:lch .55s ease-out}
@keyframes lch{0%{transform:scale(.9)}45%{transform:scale(1.28);opacity:.55}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tk{from{transform:translateY(-16%);opacity:.15}to{transform:none;opacity:1}}
#hh.tk,#mm.tk{animation:tk .5s cubic-bezier(.2,.9,.3,1.3)}
.hello,.ask,.tabs{animation:up .6s cubic-bezier(.2,.9,.3,1.1) both}.ask{animation-delay:.06s}.tabs{animation-delay:.12s}
.stg.in{animation:up .46s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--d,0) * 30ms)}
/* accesos rápidos y widgets */
.qrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:5px;font:700 9px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#555}
.qa .t{width:100%;aspect-ratio:1;max-width:50px;border-radius:50%;background:var(--tile);box-shadow:3px 3px 8px rgba(0,0,0,.12),-2px -2px 6px #fff;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .3s,color .3s}
.qa .t .ic{width:21px;height:21px}
.qa:active .t{transform:scale(.86)}
.qa.on .t{background:var(--acc);color:var(--on);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wg{background:var(--tile);border-radius:18px;padding:12px 13px;box-shadow:3px 3px 10px rgba(0,0,0,.1),-2px -2px 7px #fff;min-height:96px;display:flex;flex-direction:column;text-align:left;min-width:0;transition:transform .2s}
.wg:active{transform:scale(.96)}
.wg small{font:700 10px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.wg b{font:400 34px/1 Anton,Impact,sans-serif;margin-top:4px}
.wg span{font-size:12px;color:#444;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg .et{font:800 16px/1.1 "Barlow Condensed",sans-serif;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wg.np{grid-column:1/3;flex-direction:row;align-items:center;gap:12px;min-height:0}
.wg.np .art{width:46px;height:46px;border-radius:12px;background:#d8d4dc center/cover;flex:none;display:grid;place-items:center}
.wg.np .tx{flex:1;min-width:0}
.wg.np .tx b{font:800 15px "Barlow Condensed",sans-serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.wg.np .tx span{display:block}
.wg.np button{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.wg.np button .ic{width:17px;height:17px}
/* cajón A-Z */
.dsr{position:relative;margin:16px 0 4px}
.dsr input{width:100%;height:40px;border:0;border-radius:14px;background:var(--tile);box-shadow:inset 2px 2px 6px rgba(0,0,0,.08);padding:0 14px 0 38px;font-size:14.5px;outline:none;color:var(--ink)}
.dsr .ic{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mut)}
.lt{font:400 22px Anton,Impact,sans-serif;color:var(--ink);opacity:.85;margin:16px 0 8px;scroll-margin-top:6px}
.az{position:absolute;right:1px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;font:700 9.5px "Barlow Condensed",sans-serif;color:var(--mut);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;touch-action:none}
.az span{padding:.5px 4px;line-height:1.25}
.body.apps .az.show{opacity:1;pointer-events:auto}
.azb{position:absolute;right:36px;top:40%;width:58px;height:58px;border-radius:18px;background:var(--ink);color:#fff;display:grid;place-items:center;font:400 30px Anton,sans-serif;opacity:0;transform:scale(.6);transition:.18s;pointer-events:none;z-index:6}
.azb.on{opacity:1;transform:none}
.hidb{display:block;margin:18px auto 0;font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 14px;border-radius:10px;background:var(--tile)}
/* menú contextual */
#ctx{position:fixed;inset:0;z-index:50;pointer-events:none}
#ctx .cbg{position:absolute;inset:0;background:rgba(20,18,24,.42);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;transition:opacity .25s}
#ctx.on{pointer-events:auto}#ctx.on .cbg{opacity:1}
#ctx .clone{position:fixed;margin:0;transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:2;pointer-events:none}
#ctx.on .clone{transform:scale(1.1)}
#ctx .clone small{color:#fff;text-shadow:0 1px 4px #000}
.cm{position:fixed;width:262px;max-height:70dvh;overflow-y:auto;background:rgba(246,244,248,.97);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:6px;opacity:0;transform:scale(.55);transition:transform .38s cubic-bezier(.25,1.35,.45,1),opacity .2s;z-index:3;scrollbar-width:none}
#ctx.on .cm{opacity:1;transform:none}
.cmh{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;border-bottom:1px solid #e3dfe6}
.cmh img,.cmh .ii{width:40px;height:40px;border-radius:11px;flex:none;background:#e6e2ea;display:grid;place-items:center}
.cmh b{display:block;font:800 15.5px "Barlow Condensed",sans-serif;line-height:1.1}
.cmh small{font-size:11px;color:var(--mut)}
.cmr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;font-size:14.5px;text-align:left}
.cmr:active{background:#e6e2ea}
.cmr .ic,.cmr img{width:19px;height:19px;flex:none;border-radius:5px}
.cmr.red{color:#d42a33}
.cms{height:1px;background:#e3dfe6;margin:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:spin 1s linear infinite}
</style>
</head>

async function fetchLyrics(title,artist,dur){if(!title||title==='—'){LY={key:'',lines:[]};$('#lyr').innerHTML='';return}

  el.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(t.clientY-sy>70&&Math.abs(t.clientX-sx)<60&&Date.now()-t0<700&&hasN('openNotifications'))Android.openNotifications()},{passive:true})}

/* ---------- LANG / BOOT ---------- */
function applyLang(){const t=T();document.documentElement.lang=S.lang;$$('[data-t]').forEach(e=>{if(typeof t[e.dataset.t]==='string')e.textContent=t[e.dataset.t]});
  $('#q').placeholder=t.ask;renderTabs();go(S.tab);tick();renderDev();renderWline();renderMusic();renderCal()}
$('#ask button').innerHTML=ic('search');
window.onAndroidBack=()=>{if($('#ctx').classList.contains('on'))closeCtx();else if(document.body.classList.contains('sheetOpen'))closeSheet();else if($('#res').classList.contains('on')){$('#res').classList.remove('on');$('#q').blur()}else if(S.tab!=='home')go('home')};
window.onAndroidHome=()=>{closeCtx();closeSheet();$('#q').blur();if(S.tab!=='home')go('home');else stagger('home');$$('.pg').forEach(p=>p.scrollTo({top:0,behavior:'smooth'}))};
window.onAndroidResume=()=>{renderGCard();if(window._gOpen&&document.body.classList.contains('sheetOpen')&&$('#sheetIn [data-g]'))gestureSheet();tick();if(NATIVE)nativeDev();if(S.tab==='music')pollMedia();if(S.tab==='cal')refreshNEV();if(has('getTorch')){TORCH=Android.getTorch();renderQuick()}loadWx(false)};
applyTheme();applyLang();renderAva();renderGCard();swipeDownNotif($('#top'));renderFav();readDevice();loadSongs();refreshNEV(true);renderQuick();renderWidgets();go(S.tab,true);stagger(S.tab);
setInterval(tick,1000);
setInterval(()=>{if(document.hidden)return;if(S.tab==='home'&&has('nowPlaying')&&(tick._n=(tick._n||0)+1)%3===0)pollMedia();if(S.tab==='music'){if(has('nowPlaying'))pollMedia();if(mode()==='sys')progress(curPos(),NP.dur)}},1000);
if(S.wxLoc)loadWx(false);else setTimeout(()=>locate(true),1500);
if(NATIVE&&!S.homeAsked){S.homeAsked=true;save();try{if(!Android.isDefaultLauncher())setTimeout(()=>{const t=T();sheet(`<h3>${esc(t.home)}</h3><p style="font-size:14px;margin-bottom:14px">${esc(t.homeHint)}</p><div class="acts"><button class="btn alt" data-x>${esc(t.cancel)}</button><button class="btn" id="hm2">OK</button></div>`);$('#hm2').onclick=()=>{closeSheet();Android.setDefaultLauncher()}},1500)}catch(e){}}
if(!NATIVE&&'serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
